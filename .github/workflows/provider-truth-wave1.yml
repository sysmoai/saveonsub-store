name: Provider Truth Refresh Wave 1

on:
  push:
    branches: [ops/catalog-truth-wave1-20260903]
    paths:
      - '.github/workflows/provider-truth-wave1.yml'

permissions:
  contents: write

jobs:
  patch-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/catalog-truth-wave1-20260903
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply evidence-backed catalog truth refresh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('catalog.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def bdt_map(doc):
              out = {}
              for product in doc.get('products', []):
                  out[product['id']] = [plan.get('bdt') for plan in product.get('plans', [])]
              return out

          before_bdt = bdt_map(data)

          meta = data.setdefault('meta', {})
          meta['built'] = '2026-09-03'
          meta['provider_truth_checked_at'] = '2026-09-03'
          meta['usd_anchor_rate'] = 122.8
          meta['usd_anchor_checked_at'] = '2026-09-03'
          meta['usd_anchor_source'] = 'Bangladesh Bank USD/BDT inter-bank WAR published 2026-09-03 (previous working day)'

          verified = {
              'chatgpt-plus': {
                  'official_usd': 20,
                  'official_url': 'https://chatgpt.com/pricing/',
                  'source_url': 'https://help.openai.com/en/articles/6950777-what-is-chatgpt-plus',
                  'note': 'OpenAI lists ChatGPT Plus at USD 20/month on the web; model availability and usage limits can change.'
              },
              'chatgpt-go': {
                  'official_usd': 8,
                  'official_url': 'https://chatgpt.com/pricing/',
                  'source_url': 'https://openai.com/index/introducing-chatgpt-go/',
                  'note': 'OpenAI lists USD 8/month as the US ChatGPT Go price and states that Go pricing is localized in some markets.'
              },
              'claude-pro': {
                  'official_usd': 20,
                  'official_url': 'https://claude.com/pricing',
                  'source_url': 'https://support.claude.com/en/articles/11049762-choose-a-claude-plan',
                  'note': 'Anthropic lists Claude Pro at USD 20/month or USD 200/year; Max 5x and Max 20x are USD 100 and USD 200 monthly.'
              },
              'google-ai-pro': {
                  'official_usd': 19.99,
                  'official_url': 'https://one.google.com/about/google-ai-plans/',
                  'source_url': 'https://one.google.com/about/plans',
                  'note': 'Google lists Google AI Pro at USD 19.99/month in the referenced US plan view with 5 TB storage; benefits and availability can vary by country.'
              },
              'perplexity-pro': {
                  'official_usd': 20,
                  'official_url': 'https://www.perplexity.ai/enterprise/pricing',
                  'source_url': 'https://www.perplexity.ai/help-center/en/articles/11187416-which-perplexity-subscription-plan-is-right-for-you',
                  'note': 'Perplexity currently lists individual Pro at USD 20/month; plan capabilities and limits can change.'
              },
              'supergrok': {
                  'official_usd': 30,
                  'official_url': 'https://x.ai/pricing',
                  'source_url': 'https://x.ai/pricing',
                  'note': 'xAI lists SuperGrok at USD 30/month and SuperGrok Plus at USD 100/month. Lite and Heavy are listed as plan names; this audit does not assert an unverified current price for those tiers.'
              },
          }

          generic_answers = {
              'Which AI assistant is best for my use case?': (
                  'There is no single best assistant for every task. Compare the current official plan pages for ChatGPT, Claude, Gemini, Perplexity and other tools, then compare the SaveOnSub access type, current BDT price and warranty before ordering. Choose a second tool only when it adds a capability you actually need.'
              ),
              'Can I use these AI tools on my phone in Bangladesh?': (
                  'Most major AI providers offer web and/or mobile apps, subject to current regional and platform availability. The access method still matters: shared credentials can create privacy, session and continuity risks, so use personal/customer-specific access for sensitive work.'
              ),
              'What happens if the AI model gets updated or changed by the provider?': (
                  'Provider models, features, usage limits and prices can change. Exact access depends on the provider and the purchased plan/access method; check the linked official source and the current SaveOnSub page before ordering or renewing.'
              ),
          }

          found = set()
          for product in data.get('products', []):
              pid = product.get('id')
              if pid in verified:
                  item = verified[pid]
                  product['official_usd'] = item['official_usd']
                  product['official_url'] = item['official_url']
                  product['official_verification'] = {
                      'checked_at': '2026-09-03',
                      'source_url': item['source_url'],
                      'note': item['note'],
                  }
                  found.add(pid)

              if product.get('category') == 'AI Assistants':
                  for faq in product.get('faq', []):
                      if faq.get('q') in generic_answers:
                          faq['a'] = generic_answers[faq['q']]

              if pid == 'google-ai-pro':
                  for faq in product.get('faq', []):
                      q = faq.get('q', '')
                      if q == "What's included?":
                          faq['a'] = 'Google currently lists Google AI Pro with 5 TB cloud storage plus expanded Gemini access, Deep Research, Gemini in supported Google apps, and expanded creative-model access. Exact benefits and availability vary by country and can change.'
                      elif q == 'Why our #1 seller?':
                          faq['q'] = 'What does the current Google AI Pro plan include?'
                          faq['a'] = 'Google currently lists 5 TB cloud storage plus expanded Gemini and AI features. Check Google’s current plan page for country-specific benefits, then compare the SaveOnSub access method and current BDT price before ordering.'
                      elif q == 'Why is Google AI Pro our #1 seller at ৳500?':
                          faq['q'] = 'What should I verify before choosing Google AI Pro?'
                          faq['a'] = 'Verify the current Google AI Pro benefits available to your country and account, then compare the SaveOnSub access type, current BDT price and warranty. Google currently lists 5 TB storage for AI Pro; other benefits can vary by country.'
                      elif q == 'Plus vs AI Pro?':
                          faq['a'] = 'Google AI Pro currently includes 5 TB storage plus expanded Gemini and related AI benefits. Compare the current Google plan matrix and the SaveOnSub access type/price; features and availability can vary by country.'

              elif pid == 'claude-pro':
                  for faq in product.get('faq', []):
                      q = faq.get('q', '')
                      if q == 'Is shared Claude risky?':
                          faq['a'] = 'Shared credentials can create privacy, security, continuity and provider-policy risk. Use personal/customer-specific access for sensitive or business work, and review Anthropic’s current consumer terms before choosing any shared-access option.'
                      elif q == 'When should I choose Claude Max over Claude Pro?':
                          faq['a'] = 'Anthropic currently lists Max 5x at USD 100/month and Max 20x at USD 200/month for substantially higher usage than Pro. Choose Max only when your workload regularly exceeds Pro limits; verify current pricing and limits on Claude’s official plan page.'

              elif pid == 'supergrok':
                  for faq in product.get('faq', []):
                      q = faq.get('q', '')
                      if q == 'Why Grok?':
                          faq['a'] = 'xAI currently highlights real-time web and X search, Grok 4.6, connectors, image/video generation and higher rate limits on paid SuperGrok plans. Check the current xAI feature matrix because models and limits can change.'
                      elif q == 'Are there other Grok tiers?':
                          faq['a'] = 'Yes. xAI currently lists SuperGrok at USD 30/month and SuperGrok Plus at USD 100/month, and also lists Lite and Heavy plan names. Check xAI’s live pricing page for the current price and limits of every tier before buying.'

          missing = sorted(set(verified) - found)
          if missing:
              raise SystemExit(f'missing target products: {missing}')

          after_bdt = bdt_map(data)
          if before_bdt != after_bdt:
              raise SystemExit('REFUSING UPDATE: one or more SaveOnSub BDT plan prices changed')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evidence = {
              'checked_at': '2026-09-03',
              'scope': sorted(verified),
              'commercial_price_rule': 'No SaveOnSub plans[].bdt value changed in this refresh.',
              'fx': {
                  'usd_bdt_anchor': 122.8,
                  'source': 'Bangladesh Bank inter-bank USD/BDT WAR published 2026-09-03',
                  'purpose': 'Approximate USD-list-price comparison only; provider checkout/localized pricing may differ.'
              },
              'providers': verified,
              'content_corrections': [
                  'Google AI Pro storage corrected from stale 2 TB wording to current 5 TB wording.',
                  'Removed unsupported #1-seller / 211+ order marketing proof from Google AI Pro FAQs.',
                  'Removed blanket shared-seat mobile equivalence language.',
                  'Removed guaranteed 24-hour provider-change notification wording.',
                  'Replaced subjective/absolute Claude and Grok claims with current official-plan wording.'
              ]
          }
          report = Path('ops/provider-truth/2026-09-03-wave1.json')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('provider truth refresh applied; SaveOnSub BDT selling prices preserved exactly')
          PY

      - name: Rebuild entire static site from catalog
        run: bash build_all.sh

      - name: Apply cache-safe approved brand release pass
        run: python cache_safe_brand.py

      - name: Verify truth corrections and price preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert abs(float(d['meta']['usd_anchor_rate']) - 122.8) < 0.001
          byid={p['id']:p for p in d['products']}
          assert byid['chatgpt-plus']['official_usd'] == 20
          assert byid['chatgpt-go']['official_usd'] == 8
          assert byid['claude-pro']['official_usd'] == 20
          assert byid['google-ai-pro']['official_usd'] == 19.99
          assert byid['perplexity-pro']['official_usd'] == 20
          assert byid['supergrok']['official_usd'] == 30
          g=' '.join(x.get('a','') for x in byid['google-ai-pro'].get('faq',[]))
          assert '5 TB' in g
          assert '2TB' not in g and '2 TB' not in g
          assert '211+ orders' not in g and '#1 seller' not in g
          print('catalog truth assertions passed')
          PY
          ! grep -R -Fq '211+ orders' _site --include='*.html'
          ! grep -R -Fq '#1 seller' _site --include='*.html'
          ! grep -R -Fq 'Shared seats work the same as personal on mobile' _site --include='*.html'
          ! grep -R -Fq 'notify active subscribers within 24 hours' _site --include='*.html'
          ! grep -R -Fq 'SuperGrok Lite $10' _site --include='*.html'
          ! grep -R -Fq 'fewer refusals' _site --include='*.html'
          grep -Fq '5 TB' _site/p/google-ai-pro.html
          grep -Fq 'Official: ~৳2,456/mo ($20)' _site/p/chatgpt-plus.html
          grep -Fq '/assets/logo-' _site/index.html
          echo 'generated public truth checks passed'

      - name: Commit rebuilt truth-safe source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/provider-truth-wave1.yml
          git config user.name 'saveonsub-truth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'truth: refresh high-impact provider facts and FX anchor'
          git push origin HEAD:ops/catalog-truth-wave1-20260903
