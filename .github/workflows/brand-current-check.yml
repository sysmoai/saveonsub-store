name: Validate Current Locked Brand Payloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-current-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Decode current approved wrappers
        run: |
          python3 - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          for rel in ('assets/favicon.svg','assets/logo.svg'):
              text = Path(rel).read_text(encoding='utf-8')
              m = re.search(r'href="data:image/png;base64,([A-Za-z0-9+/=]+)"', text)
              if not m:
                  raise SystemExit(f'{rel}: no embedded PNG')
              raw = base64.b64decode(m.group(1), validate=True)
              try:
                  im = Image.open(io.BytesIO(raw))
                  im.load()
              except Exception as exc:
                  raise SystemExit(f'{rel}: decode failed: {type(exc).__name__}: {exc}')
              print(f'{rel}: OK {im.format} {im.size} {im.mode} bytes={len(raw)}')
          PY
