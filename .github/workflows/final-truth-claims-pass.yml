name: Final Truth Claims Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-truth-claims-pass.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply comprehensive v2 corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/fix-truth-seo-safety-v2.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          block=src[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/v2.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 /tmp/v2.py

      - name: Reapply reviewed eight-gap closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/finish-truth-seo-pass.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          blocks=[]; pos=0
          while True:
              start=src.find(marker,pos)
              if start < 0: break
              start += len(marker)
              end=src.find("\n          PY",start)
              if end < 0: raise SystemExit('unterminated Python block')
              block=src[start:end]
              blocks.append('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n')
              pos=end+1
          if len(blocks) < 2: raise SystemExit(f'expected >=2 Python blocks, got {len(blocks)}')
          Path('/tmp/eight-gap.py').write_text(blocks[1],encoding='utf-8')
          PY
          python3 /tmp/eight-gap.py

      - name: Remove final stale trust claims at their source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if required and n == 0:
                  raise SystemExit(f'{path}: expected text missing: {old[:120]!r}')
              if n:
                  p.write_text(s.replace(old,new),encoding='utf-8')
              print('replace',path,n,old[:90])

          # Bangla homepage: remove unsupported social proof, exclusivity and
          # absolute shared-privacy statements while keeping current policy labels.
          replace('build_home.py',
            '<span>✅ <b>৩,০০০+ কাস্টমার</b> ২০২৪ থেকে</span><span>⚡ <b>৫–১৫ মিনিটে</b> ডেলিভারি</span><span>🛡️ <b>১ ঘণ্টায়</b> রিপ্লেসমেন্ট ওয়ারেন্টি</span><span>💳 বিকাশ · নগদ · রকেট</span>',
            '<span>🔎 <b>Access type</b> অর্ডারের আগে দেখুন</span><span>⚡ <b>Instant plan:</b> ৫–১৫ মিনিট SLA</span><span>🛡️ <b>Warranty:</b> plan অনুযায়ী</span><span>💳 বিকাশ · নগদ · রকেট</span>')
          replace('build_home.py',
            '২০২৪ থেকে ৩,০০০+ কাস্টমার, পাবলিক WhatsApp, verifiable brand (SYSmoAI, aipremiumshop.com)। প্রথম অর্ডারে ভয়? <b>Pay-After-Testing</b> — আগে access, verify করে তারপর টাকা। বাংলাদেশে আর কোনো দোকান এটা দেয় না।',
            'যাচাইযোগ্য তথ্য দেখুন: পাবলিক WhatsApp, current price, access label, provider link যেখানে আছে, এবং written warranty/refund terms। Pay-After-Testing শুধু selected product/order-এ explicitly offered হলে প্রযোজ্য।')
          replace('build_home.py',
            'না। প্রতিটা ইউজারের কথোপকথন আলাদা ও প্রাইভেট। শুধু সাবস্ক্রিপশনের খরচ শেয়ার হয়, আপনার ডেটা নয়। কাজের জন্য চাইলে Personal নিন — নিজের ইমেইলে।',
            'Privacy exact access method-এর ওপর নির্ভর করে। Shared credentials-এ অন্য access holder activity বা data দেখতে পারে; sensitive information-এর জন্য personal/customer-specific plan নিন।')
          replace('build_home.py',
            'বিকাশ, নগদ বা রকেট Send Money। Checkout-এ merchant নাম্বার copy বাটন সহ, অর্ডার আইডি রেফারেন্স। ৬০ সেকেন্ডে শেষ।',
            'বিকাশ, নগদ বা রকেটের available payment instructions Checkout-এ দেখুন। সেখানে payment number এবং order reference থাকবে; টাকা পাঠানোর আগে details মিলিয়ে নিন।')

          # Trust/help source: make pay-after-testing conditional wherever it appears
          # outside the FAQ block already corrected by v2.
          replace('build_trust.py',
            '<p class="sub" style="font-size:15px">Use <b style="color:var(--green2)">Pay-After-Testing</b> at checkout — we send access before you pay on eligible first orders. You verify, then you pay. That\'s how confident we are.</p>',
            '<p class="sub" style="font-size:15px">If <b style="color:var(--green2)">Pay-After-Testing</b> is explicitly offered for the selected product/order, support will confirm the process before payment. Otherwise use the standard checkout flow.</p>')
          replace('build_trust.py',
            'Pick product → send money via bKash/Nagad → confirm on WhatsApp → delivered in 5–15 min. Full first-timer guide including pay-after-testing.',
            'Pick a product → follow the available local payment instructions → confirm on WhatsApp → delivery follows the SLA shown for the selected plan.')
          replace('build_trust.py',
            '<div class="notice green mt3">🤝 Nervous first order? Ask about <a href="how-to-order.html" style="color:var(--green2);font-weight:700">pay-after-testing</a> — we send access before you pay.</div>',
            '<div class="notice green mt3">🤝 Nervous first order? Ask whether <a href="how-to-order.html" style="color:var(--green2);font-weight:700">pay-after-testing</a> is explicitly available for your selected product/order before payment.</div>')
          replace('build_trust.py',
            'WhatsApp +880 1305-869242, email, support hours, all-Bangladesh coverage. A real person replies in minutes, Bangla or English. Warranty in 1 hour.',
            'WhatsApp +880 1305-869242, email, listed support hours and all-Bangladesh digital coverage. Warranty requests follow the written SaveOnSub policy.')
          replace('build_trust.py',
            '<div class="tcard"><b style="color:var(--green2)">💳 Payment number</b><p class="sub" style="font-size:14px;margin-top:8px">bKash/Nagad/Rocket merchant (send-money at checkout).</p><div style="font-weight:900;color:var(--gold);margin-top:8px">+880 1305-869242</div></div>',
            '<div class="tcard"><b style="color:var(--green2)">💳 Payment number</b><p class="sub" style="font-size:14px;margin-top:8px">Use only the payment method and number displayed at checkout for your order.</p><div style="font-weight:900;color:var(--gold);margin-top:8px">+880 1305-869242</div></div>')
          replace('build_trust.py',
            '<tr><td>WhatsApp</td><td>9:00 AM – 12:00 AM daily</td><td>Within minutes</td></tr>\n<tr><td>Warranty claims</td><td>9:00 AM – 12:00 AM</td><td>Replacement within 1 hour</td></tr>\n<tr><td>Email</td><td>Checked daily</td><td>Within 24 hours</td></tr>',
            '<tr><td>WhatsApp</td><td>9:00 AM – 12:00 AM daily</td><td>Human support during listed hours</td></tr>\n<tr><td>Warranty claims</td><td>9:00 AM – 12:00 AM</td><td>Handled under the applicable written warranty policy</td></tr>\n<tr><td>Email</td><td>Checked daily</td><td>Response time varies with support load</td></tr>')
          replace('build_trust.py',
            '<p class="sub mt2" style="font-size:14px">Outside hours (12 AM–9 AM)? Message anyway — we reply first thing, and your warranty clock pauses, so you lose nothing.</p>',
            '<p class="sub mt2" style="font-size:14px">Outside listed support hours? You can still send the message; the team will handle it when support resumes. Warranty handling follows the written policy for the selected plan.</p>')

          # Bangla FAQ: legitimacy and discount mechanics must be evidence/current-offer based.
          replace('build_trust.py',
            'ন্যায্য প্রশ্ন — বাংলাদেশে সাবস্ক্রিপশন স্ক্যাম অনেক। প্রমাণ: ২০২৪ থেকে ৩,০০০+ কাস্টমার, যাচাইযোগ্য SYSmoAI পরিবার (sysmoai.com, aipremiumshop.com), পাবলিক হোয়াটসঅ্যাপে মানুষ উত্তর দেয়, আর <b>pay-after-testing</b> — আগে অ্যাক্সেস, যাচাই করে তারপর টাকা। যোগ্য অর্ডারে পেমেন্ট সম্পন্ন করার আগে অ্যাক্সেস কাজ করছে কি না যাচাই করা যায়।',
            'কেনার আগে যাচাই করুন: পাবলিক WhatsApp, current price, access label, official-provider link যেখানে আছে, এবং written warranty/refund terms। Pay-after-testing শুধু selected product/order-এ explicitly offered হলে প্রযোজ্য।')
          replace('build_trust.py',
            "দুটি সৎ কারণ: (১) শেয়ার্ড প্ল্যানে একটি সাবস্ক্রিপশনের খরচ কয়েকজন ভাগ করে নেয় — এটাই ডিসকাউন্ট, আর এ কারণেই প্রোভাইডারের শর্তে এটা অনুমোদিত নয় (এই 'সমস্যা'টা আমরা প্রতিটি প্রোডাক্টে লিখে দিই ও ওয়ারেন্টিতে কভার করি); (২) পার্সোনাল প্ল্যানে রিজিওনাল প্রাইসিং। অফিসিয়াল দামটাও পাশে দেখাই, যাতে কী বাঁচছে বোঝেন।",
            "কম দামের কারণ product অনুযায়ী shared/multi-user access, regional pricing, bundle বা seller sourcing হতে পারে। Provider rules এবং trade-off service অনুযায়ী ভিন্ন; তাই access method ও comparison reference অর্ডারের আগে দেখুন।")

          # Offers page: no standing discount/referral/student promises without current evidence.
          replace('build_trust.py',
            '<div class="tcard"><b style="color:var(--green2)">🤝 Pay-after-testing</b><p class="sub" style="font-size:14px;margin-top:8px">First order: access before payment. The best "offer" is trust.</p></div>',
            '<div class="tcard"><b style="color:var(--green2)">🤝 Pay-after-testing</b><p class="sub" style="font-size:14px;margin-top:8px">Available only when explicitly confirmed for the selected product/order before payment.</p></div>')
          replace('build_trust.py',
            'Real standing offers: 10-15% bulk discount, ৳100 refer-a-friend, ৳100 student discount, bundle savings, pay-after-testing. No fake countdowns.',
            'Current SaveOnSub offers, bundles and eligibility terms. Verify the exact product, duration and discount before payment; no fake countdowns.')

          # Refund page should not imply pay-after-testing is a universal escape hatch.
          replace('build_trust.py',
            '<div class="notice green mt3">🤝 Still deciding? Use <b>pay-after-testing</b> on your first order and you\'ll never need this page.</div>',
            '<div class="notice green mt3">🤝 Still deciding? Ask whether <b>pay-after-testing</b> is explicitly available for your selected product/order; otherwise use the standard checkout and written refund terms.</div>')

          # Bangla how-to: 3 minutes is the guide/process, not a universal delivery promise.
          replace('build_trust.py',
            '{"@type":"HowToStep","position":4,"name":"৫–১৫ মিনিটে পান","text":"অ্যাক্সেস বা ইনভাইট হোয়াটসঅ্যাপে আসবে। প্রথম মিনিট থেকেই ওয়ারেন্টি চালু।"}',
            '{"@type":"HowToStep","position":4,"name":"প্ল্যানের SLA অনুযায়ী ডেলিভারি","text":"Selected plan-এর instant/fast/managed SLA অনুযায়ী access বা invite delivery হবে; applicable warranty terms product/order অনুযায়ী দেখুন।"}')
          replace('build_trust.py',
            '<meta name="description" content="প্রোডাক্ট বাছুন → বিকাশ/নগদে টাকা পাঠান → হোয়াটসঅ্যাপে কনফার্ম → ৫–১৫ মিনিটে ডেলিভারি। নতুনদের জন্য পূর্ণ গাইড, pay-after-testing সহ।">',
            '<meta name="description" content="প্রোডাক্ট বাছুন → available local payment instructions অনুসরণ করুন → WhatsApp-এ confirm করুন → selected plan-এর SLA অনুযায়ী delivery।">')
          replace('build_trust.py',
            '<h1 style="font-size:clamp(26px,4vw,38px)">প্রথমবার? <span class="grad-text">৩ মিনিটে ডেলিভারি পর্যন্ত।</span></h1>',
            '<h1 style="font-size:clamp(26px,4vw,38px)">প্রথমবার? <span class="grad-text">৩ মিনিটে অর্ডার প্রক্রিয়া বুঝুন।</span></h1>')
          replace('build_trust.py',
            '<p class="sub" style="font-size:15px">চেকআউটে <b style="color:var(--green2)">Pay-After-Testing</b> ব্যবহার করুন — যোগ্য প্রথম অর্ডারে আগে অ্যাক্সেস পাঠাই, আপনি যাচাই করে তারপর টাকা দেন। এতটাই কনফিডেন্ট আমরা।</p>',
            '<p class="sub" style="font-size:15px"><b style="color:var(--green2)">Pay-After-Testing</b> universal নয়। Selected product/order-এ explicitly offered হলে support payment-এর আগে exact process confirm করবে; না হলে standard checkout follow করুন।</p>')
          PY

      - name: Build everything and require all permanent gates green
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          bash build_all.sh

      - name: Final claim sweep
        run: |
          set -euo pipefail
          python audit_all.py
          python truth_guard.py
          python check_prices.py
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/index.html
          ! grep -R -E '৩,০০০\+ কাস্টমার|3,000\+ customers|we send access before you pay|We send a WhatsApp reminder 3 days|বাংলাদেশে আর কোনো দোকান এটা দেয় না|merchant নাম্বার|First order: access before payment' _site --include='*.html' --include='*.js' --include='*.txt'
          echo 'ALL FINAL CLAIM GATES GREEN'

      - name: Commit final corrected website candidate
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add -A
          git reset .github/workflows/final-truth-claims-pass.yml
          git reset .github/workflows/finish-truth-seo-pass.yml
          git reset .github/workflows/continue-truth-seo-pass.yml
          git reset .github/workflows/fix-truth-seo-safety-v2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finalize evidence-safe trust and conversion copy'
          git push origin HEAD:main
