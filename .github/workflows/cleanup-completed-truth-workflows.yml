name: Cleanup Completed Truth Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-truth-workflows.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove completed one-shot workflows
        run: |
          rm -f .github/workflows/continue-truth-seo-pass.yml
          rm -f .github/workflows/final-truth-claims-pass.yml
          rm -f .github/workflows/finish-truth-seo-pass.yml
          rm -f .github/workflows/fix-truth-seo-safety-v2.yml
          rm -f .github/workflows/cleanup-completed-truth-workflows.yml
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add -A
          git commit -m 'ops: remove completed truth SEO workflows'
          git push origin HEAD:main
