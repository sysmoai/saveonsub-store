name: SaveOnSub Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 08:15 Asia/Dhaka (02:15 UTC)
    - cron: '15 2 * * 1'

concurrency:
  group: saveonsub-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Truth and price consistency guard
        run: python check_prices.py

      - name: Full repository regression audit
        run: python audit_all.py

      - name: Stage exact public artifact
        run: python stage_deploy.py

      - name: Make approved logo cache-safe
        run: python cache_safe_brand.py

      - name: Verify public release boundary
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          versioned_logo=$(grep -o '/assets/logo-[0-9a-f]\{16\}\.svg' _site/index.html | head -1)
          test -n "$versioned_logo"
          test -f "_site${versioned_logo}"
          grep -q 'data-brand-lock="2026-08-19-approved"' "_site${versioned_logo}"
          if grep -R -q 'assets/logo\.svg' _site --include='*.html'; then
            echo "::error::Mutable logo URL remains in staged HTML."
            exit 1
          fi
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          echo "Quality gates passed; staged public release boundary and cache-safe brand references are clean."
