name: SaveOnSub Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 08:15 Asia/Dhaka (02:15 UTC)
    - cron: '15 2 * * 1'

concurrency:
  group: saveonsub-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Truth and price consistency guard
        run: python check_prices.py

      - name: Full repository regression audit
        run: python audit_all.py

      - name: Stage exact public artifact
        run: python stage_deploy.py

      - name: Harden staged SEO and truth surface
        run: python release_hardening.py

      - name: Apply verified Google AI cohort facts
        run: python google_ai_cohort.py

      - name: Make approved logo cache-safe
        run: python cache_safe_brand.py

      - name: Verify public release boundary
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          grep -q 'User-agent: OAI-SearchBot' _site/robots.txt
          grep -q 'data-google-ai-facts="2026-09-04"' _site/p/google-ai-pro.html
          grep -q 'data-google-ai-facts="2026-09-04"' _site/p/google-ai-plus.html
          grep -q 'Google Bangladesh: ৳2,500/mo' _site/p/google-ai-pro.html
          grep -q 'Google Bangladesh: ৳600/mo' _site/p/google-ai-plus.html
          if grep -R -q '<meta name="keywords"' _site --include='*.html'; then
            echo "::error::Generated meta-keywords remain in staged HTML."
            exit 1
          fi
          if grep -R -q 'Commonly searched as' _site --include='*.html'; then
            echo "::error::Visible keyword-dump section remains in staged HTML."
            exit 1
          fi
          for phrase in 'Every subscription is official' '100% customer-owned' 'Price-match guarantee' 'replace dead seats within 1 hour'; do
            if grep -R -F -q "$phrase" _site --include='*.html' --include='llms.txt'; then
              echo "::error::Unsafe blanket claim remains in staged public artifact: $phrase"
              exit 1
            fi
          done
          if grep -i -q '2TB\|83% off special\|our #1 seller' _site/p/google-ai-pro.html; then
            echo "::error::Stale Google AI Pro claim remains in staged page."
            exit 1
          fi
          versioned_logo=$(grep -o '/assets/logo-[0-9a-f]\{16\}\.svg' _site/index.html | head -1)
          test -n "$versioned_logo"
          test -f "_site${versioned_logo}"
          grep -q 'data-brand-lock="2026-08-19-approved"' "_site${versioned_logo}"
          if grep -R -q 'assets/logo\.svg' _site --include='*.html'; then
            echo "::error::Mutable logo URL remains in staged HTML."
            exit 1
          fi
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          echo "Quality gates passed; staged SEO/truth surface, Google AI cohort, public boundary and cache-safe brand references are clean."
