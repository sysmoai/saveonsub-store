name: SaveOnSub Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'review/**']
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 1'

concurrency:
  group: saveonsub-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit price and WhatsApp regression tests
        run: |
          python -m unittest -v test_audit_home_prices
          python test_whatsapp_cta.py
          python -m unittest discover -v -s tests -p 'test_*.py'

      - name: Block cost / margin fields in tracked files
        run: |
          set -euo pipefail
          if git grep -nIiE 'landed[_ ]cost|margin[_]bdt|contribution[_]bdt|supplier[_]cost[_]bdt' -- . ':!*.md'; then
            echo "::error::Cost/margin fields must not be committed to this public repository."
            exit 1
          fi

      - name: Setup Node (Order OS security tests use built-in TypeScript + SQLite)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Order OS security tests (Access JWT, state machine, payment provenance, concurrency, PII)
        run: |
          set -euo pipefail
          python audit_order_os.py
          node --import ./tests/order-os/register.mjs --test tests/order-os/*.test.mjs

      - name: Full repository regression audit
        run: |
          set -euo pipefail
          python check_prices.py
          python audit_all.py
          python deploy_preflight.py

      - name: Build exact canonical candidate
        run: python build_site.py

      - name: Product SEO staged gate (post-build, same _site artifact)
        run: |
          set -euo pipefail
          python product_seo_enrich.py --check
          python product_rich_results.py --check
          python prices_page.py --check
          python all_static_index.py --check
          python conversion_upgrade.py --check
          python -m unittest -v tests.test_product_seo 2>&1 | tee /tmp/product_seo_tests.log
          ! grep -q "skipped" /tmp/product_seo_tests.log || exit 1  # bash ignores set -e for '!' commands
          python -m unittest -v tests.test_support_terms_v1 2>&1 | tee /tmp/support_terms_tests.log
          ! grep -q "skipped" /tmp/support_terms_tests.log || exit 1  # bash ignores set -e for '!' commands
          python -m unittest -v tests.test_mobile_ux

      - name: Brand kit pinned files match staged output
        run: python -m unittest -v tests.test_brand_kit_integration

      - name: Only CEO-approved prices in staged HTML (EXEC-010 selective unlock)
        run: |
          python hold_content_price_guard.py --check
          python site_seo_hygiene.py --check
          python link_hygiene.py --check
          python a11y_polish.py --check
          python motion_polish.py --check
          python tech_motion.py --check
          python category_copy_polish.py --check
          python blog_copy_polish.py --check
          python buyer_intent_polish.py --check
          python cross_unit_quarantine.py --check
          python fab_polish.py --check
          python mobile_policy_tables.py --check
          python coverage_disclosure.py --check
          python -m unittest -v tests.test_coverage_disclosure
          python order_sequence_truth.py --check
          python -m unittest -v tests.test_order_sequence_truth
          python checkout_sequence_truth.py --check
          python -m unittest -v tests.test_checkout_sequence_truth
          python release_truth_audit.py

      - name: Verify governed pricing-v2 release boundary
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          grep -q 'User-agent: OAI-SearchBot' _site/robots.txt
          ! grep -qiE 'commercial HOLD|publishes no fixed|not currently offered for sale' _site/llms.txt || exit 1  # bash ignores set -e for '!' commands # AI-search facts match live prices
          grep -q '৳499' _site/llms.txt
          grep -q 'data-sos-org-schema' _site/index.html
          grep -q 'saveonsub-commercial-revision" content="pricing-v2-2026-09-17' _site/index.html
          grep -q '৳3,390' _site/p/chatgpt-plus.html  # CEO APPROVE PRICE 3390 (PR #117)
          ! grep -q '৳3,390' _site/p/google-ai-pro.html || exit 1  # bash ignores set -e for '!' commands
          ! grep -q '৳1,299' _site/p/chatgpt-go.html || exit 1  # bash ignores set -e for '!' commands
          ! grep -q '৳4,290' _site/p/chatgpt-business.html || exit 1  # bash ignores set -e for '!' commands
          grep -q 'pricing-v2-2026-09-17' _site/assets/catalog.js
          grep -q 'SELECTIVE_UNLOCK' ops/PRICING-V2-2026-09-17.json
          grep -q '৳499' _site/p/chatgpt-plus.html  # CEO 2026-11-12: shared plans restored (reverses #130)
          grep -q '৳999' _site/p/chatgpt-plus.html
          grep -q 'Shared account (multiple users)' _site/p/chatgpt-plus.html
          grep -q '৳500' _site/p/google-ai-pro.html
          grep -q '"bdt"' _site/assets/catalog.js
          python catalog_hold_gate.py
          ! grep -q 'SHARED · POLICY RISK' _site/p/chatgpt-plus.html || exit 1  # bash ignores set -e for '!' commands
          ! grep -q 'SHARED · WARRANTY COVERED' _site/p/chatgpt-plus.html || exit 1  # bash ignores set -e for '!' commands
          ! grep -q '5–15 min' _site/p/chatgpt-plus.html || exit 1  # bash ignores set -e for '!' commands
          grep -q '<link rel="canonical" href="https://saveonsub.com/p/chatgpt-plus">' _site/p/chatgpt-plus.html
          grep -q '<meta name="robots" content="noindex,follow">' _site/checkout.html
          grep -Eq 'favicon-32\.png\?v=[0-9a-f]{10}" type="image/png"' _site/p/chatgpt-plus.html
          ! grep -q 'https://saveonsub.com/.*\.html' _site/sitemap.xml || exit 1  # bash ignores set -e for '!' commands
          python audit_commercial_truth_v2.py

          if grep -R -q '<meta name="keywords"' _site --include='*.html'; then
            echo "::error::Generated meta-keywords remain in staged HTML."
            exit 1
          fi
          if grep -R -q 'Commonly searched as' _site --include='*.html'; then
            echo "::error::Visible keyword-dump section remains in staged HTML."
            exit 1
          fi

          for phrase in 'Every subscription is official' '100% customer-owned' 'Price-match guarantee' 'replace dead seats within 1 hour' 'Shared seats work the same as personal on mobile' 'SHARED · LOW RISK' 'SHARED · WARRANTY COVERED' 'enforcement is light but real' 'No official path without a card' 'Netflix has no official taka price' 'regional pricing around ৳239/month' 'other seat-holders can never see your usage' '১ ঘণ্টায় রিপ্লেস' 'শর্ত অনুযায়ী অনুমোদিত নয়' '7 days (shared) / 30 days (personal)' 'চেকআউটে চেকআউটে'; do
            if grep -R -F -q "$phrase" _site --include='*.html' --include='llms.txt'; then
              echo "::error::Unsafe or stale claim remains in staged public artifact: $phrase"
              exit 1
            fi
          done

          versioned_logo=$(grep -o '/assets/logo-[0-9a-f]\{16\}\.png' _site/index.html | head -1)
          test -n "$versioned_logo"
          test -f "_site${versioned_logo}"
          if grep -R -q 'assets/logo\.svg' _site --include='*.html'; then
            echo "::error::Mutable logo URL remains in staged HTML."
            exit 1
          fi

          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          test ! -d _site/ops
          test ! -d _site/functions
          test ! -d _site/workers
          test ! -d _site/tests
          test ! -d _site/staff-ui
          if find _site -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.sql' -o -name '.env*' -o -name '.dev.vars*' \) | grep -q .; then
            echo "::error::Private source file detected inside staged public artifact."
            exit 1
          fi
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          echo "Quality gates passed; pricing-v2, technical SEO, public boundary and locked brand references are clean."
