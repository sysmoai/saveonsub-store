name: SaveOnSub Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 1'

concurrency:
  group: saveonsub-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Full repository regression audit
        run: |
          set -euo pipefail
          python check_prices.py
          python audit_all.py
          python deploy_preflight.py

      - name: Build exact canonical candidate
        run: python build_site.py

      - name: Verify public release boundary and current cohorts
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          grep -q 'User-agent: OAI-SearchBot' _site/robots.txt

          grep -q 'data-google-ai-facts="2026-09-09"' _site/p/google-ai-pro.html
          grep -q 'Google Bangladesh: ৳2,500/mo' _site/p/google-ai-pro.html
          grep -q '5 TB' _site/p/google-ai-pro.html
          grep -q 'data-chatgpt-facts="2026-09-07"' _site/p/chatgpt-plus.html
          grep -q 'data-canva-facts="2026-09-08"' _site/p/canva-pro.html
          grep -q 'data-midjourney-facts="2026-09-08"' _site/p/midjourney.html
          grep -q 'data-claude-facts="2026-09-09"' _site/p/claude-pro.html
          grep -q 'data-supergrok-facts="2026-09-09"' _site/p/supergrok.html
          grep -q 'data-perplexity-facts="2026-09-09"' _site/p/perplexity-pro.html

          grep -q '<link rel="canonical" href="https://saveonsub.com/p/chatgpt-plus">' _site/p/chatgpt-plus.html
          grep -q '<meta name="robots" content="noindex,follow">' _site/checkout.html
          grep -q 'favicon-32.png" type="image/png"' _site/p/chatgpt-plus.html
          ! grep -q 'https://saveonsub.com/.*\.html' _site/sitemap.xml

          if grep -R -q '<meta name="keywords"' _site --include='*.html'; then
            echo "::error::Generated meta-keywords remain in staged HTML."
            exit 1
          fi
          if grep -R -q 'Commonly searched as' _site --include='*.html'; then
            echo "::error::Visible keyword-dump section remains in staged HTML."
            exit 1
          fi

          for phrase in 'Every subscription is official' '100% customer-owned' 'Price-match guarantee' 'replace dead seats within 1 hour' 'Shared seats work the same as personal on mobile' 'SHARED · LOW RISK'; do
            if grep -R -F -q "$phrase" _site --include='*.html' --include='llms.txt'; then
              echo "::error::Unsafe blanket claim remains in staged public artifact: $phrase"
              exit 1
            fi
          done

          versioned_logo=$(grep -o '/assets/logo-[0-9a-f]\{16\}\.png' _site/index.html | head -1)
          test -n "$versioned_logo"
          test -f "_site${versioned_logo}"
          if grep -R -q 'assets/logo\.svg' _site --include='*.html'; then
            echo "::error::Mutable logo URL remains in staged HTML."
            exit 1
          fi

          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          echo "Quality gates passed; canonical candidate, all current cohorts, technical SEO, public boundary and locked brand references are clean."
