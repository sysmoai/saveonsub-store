name: SOS Commerce SSOT - Preview Safety

on:
  pull_request:
    paths:
      - 'ops/commerce/**'
      - 'tests/test_commerce_ssot.py'
      - 'staff-ui/**'
      - 'functions/api/ops/catalog/**'
      - 'functions/api/ops/media/**'
      - '.github/workflows/sos-commerce-ssot.yml'
  push:
    branches:
      - 'feat/sos-commerce-*'
    paths:
      - 'ops/commerce/**'
      - 'tests/test_commerce_ssot.py'
      - 'staff-ui/**'
      - 'functions/api/ops/catalog/**'
      - 'functions/api/ops/media/**'
      - '.github/workflows/sos-commerce-ssot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-review-contract:
    name: D1 Schema and Catalog Truth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed commerce schema tests
        run: python -m unittest discover -s tests -p test_commerce_ssot.py -v
      - name: Audit every legacy product and poster without approving sales
        run: |
          python ops/commerce/tools/build_review_manifest.py --out ops/commerce/exports/review_manifest.json
          python - <<'PY'
          import json
          p='ops/commerce/exports/review_manifest.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='REVIEW_ONLY_NOT_LIVE'
          assert x['counts']['legacy_products']>0
          assert x['counts']['missing_poster_files']==0, 'Missing product poster assets'
          assert not any(row['publish_allowed'] or row['sales_approval']!='HOLD' for row in x['items'])
          print('LEGACY_ASSET_COVERAGE_OK',x['counts'])
          PY
      - name: Validate operator UI JavaScript
        run: node --check staff-ui/catalog.js
      - name: Bundle private Pages Functions without production credentials
        run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/sos-pages-functions.mjs
      - name: Produce all review-only product posters
        run: |
          python ops/commerce/tools/generate_review_posters.py --out ops/commerce/exports/poster_review
          python - <<'PY'
          import json
          p=json.load(open('ops/commerce/exports/poster_review/manifest.json'))
          assert p['posters']==p['products']*3
          assert not any(row['publish_allowed'] for row in p['items'])
          print('POSTER_DRAFT_GENERATION_OK',p['products'],p['posters'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sos-poster-review-${{ github.sha }}
          path: ops/commerce/exports/poster_review/
          retention-days: 7
      - name: Confirm governance artifacts are not in public output
        run: |
          test ! -e _site/ops/commerce
          test ! -e _site/tests/test_commerce_ssot.py
          test ! -e _site/staff-ui/catalog.html
          echo "SSOT foundation contract passed; no deployment performed."
