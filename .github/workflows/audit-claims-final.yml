name: Inventory Remaining Global Service Claims

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claims-final.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count remaining claim language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = [
            '5–15', '5-15', '1-hour', 'within 1 hour', 'in minutes',
            'warranty on everything', 'we send access before you pay',
            'customers come back', 'orders delivered', 'total orders',
            'pay-after-testing', 'Pay After Testing', 'authentic subscriptions',
            'guarantee on shared', '30-day', '7-day',
          ]
          files=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('.git','.github','_site','node_modules','ops','reports')):
                  continue
              if p.suffix.lower() not in {'.py','.html','.htm','.js','.json'}: continue
              try: text=p.read_text(encoding='utf-8',errors='ignore')
              except OSError: continue
              files.append((p.as_posix(),text))
          for needle in needles:
              hits=[]; occurrences=0
              for path,text in files:
                  n=text.lower().count(needle.lower())
                  if n:
                      occurrences += n; hits.append(path)
              print(repr(needle), 'occurrences=',occurrences,'files=',len(hits),','.join(hits[:30]))
          PY
