name: Validate Architecture

on:
  push:
    branches-ignore:
      - main
      - gh-pages
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate control JSON
        run: |
          python -m json.tool catalog.json > /dev/null
          python -m json.tool docs/control/launch_state.json > /dev/null
          python -m json.tool docs/control/contact_authority.json > /dev/null
          python -m json.tool docs/control/payment_authority.json > /dev/null
          python -m json.tool docs/control/pricing_authority.json > /dev/null
          python -m json.tool docs/control/provider_eligibility.json > /dev/null
          python -m json.tool docs/control/legal_authority.json > /dev/null

      - name: Compile architecture and control scripts
        run: |
          python -m py_compile site_config.py
          python -m py_compile templates.py
          python -m py_compile authority_model.py
          python -m py_compile inventory_site.py
          python -m py_compile stage_deploy.py
          python -m py_compile validate_release.py
          python -m py_compile routes_v3.py
          python -m py_compile media_registry.py
          python -m py_compile catalog_model.py
          python -m py_compile validate_catalog_model.py
          python -m py_compile validate_authority_boundaries.py
          python -m py_compile audit_authority_surface.py
          python -m py_compile build_plan_pages_v3.py
          python -m py_compile validate_v3_preview.py
          python -m py_compile build_product_pages_v3.py
          python -m py_compile validate_v3_product_preview.py
          python -m py_compile seed_plan_runtime.py
          python -m py_compile validate_commerce_worker.py

      - name: Check browser JavaScript syntax
        run: node --check assets/app.js

      - name: Validate protected authority boundaries
        run: python validate_authority_boundaries.py

      - name: Validate v3 catalog compatibility model
        run: python validate_catalog_model.py

      - name: Inventory authority-sensitive surfaces
        run: python audit_authority_surface.py

      - name: Inventory and route parity
        run: python inventory_site.py

      - name: Generate preview-only v3 plan pages
        run: python build_plan_pages_v3.py

      - name: Generate preview-only v3 product pages
        run: python build_product_pages_v3.py

      - name: Validate preview-only v3 plan pages
        run: python validate_v3_preview.py

      - name: Validate preview-only v3 product pages
        run: python validate_v3_product_preview.py

      - name: Generate fail-closed D1 plan seed
        run: python seed_plan_runtime.py

      - name: Validate shadow commerce posture
        run: python validate_commerce_worker.py

      - name: Test shadow Worker quote authority
        run: node commerce-worker/test.mjs

      - name: Stage public artifact safely
        run: python stage_deploy.py

      - name: Verify preview and backend workspaces are not deployable
        run: |
          test ! -e _site/_preview_v3
          test ! -e _site/commerce-worker
          test ! -e _site/p/chatgpt-plus/starter-shared-6-8-users.html
          test ! -e _site/bn/p/chatgpt-plus/starter-shared-6-8-users.html

      - name: Verify no internal JSON entered public artifact
        run: |
          if find _site -type f -name '*.json' -print -quit | grep -q .; then
            echo 'Unexpected JSON found in _site:'
            find _site -type f -name '*.json' -print
            exit 1
          fi

      - name: Verify required public files
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/sw.js
          test -f _site/assets/app.js
          test -f _site/assets/style.css

  cloudflare-credential-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Cloudflare credential only
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Credential probe is read-only
        run: echo 'No Cloudflare resource was created, changed, deployed, or deleted by this job.'

  release-integrity-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report fail-closed production blockers
        run: python validate_release.py
