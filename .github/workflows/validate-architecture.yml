name: Validate Architecture

on:
  push:
    branches-ignore:
      - main
      - gh-pages
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate control JSON
        run: |
          python -m json.tool catalog.json > /dev/null
          python -m json.tool docs/control/launch_state.json > /dev/null
          python -m json.tool docs/control/contact_authority.json > /dev/null
          python -m json.tool docs/control/payment_authority.json > /dev/null
          python -m json.tool docs/control/pricing_authority.json > /dev/null
          python -m json.tool docs/control/provider_eligibility.json > /dev/null
          python -m json.tool docs/control/legal_authority.json > /dev/null
          python -m json.tool data/media/media_registry.json > /dev/null

      - name: Compile architecture and control scripts
        run: |
          python -m py_compile site_config.py
          python -m py_compile templates.py
          python -m py_compile authority_model.py
          python -m py_compile inventory_site.py
          python -m py_compile stage_deploy.py
          python -m py_compile validate_release.py
          python -m py_compile validate_l1_release.py
          python -m py_compile routes_v3.py
          python -m py_compile media_registry.py
          python -m py_compile media_authoring.py
          python -m py_compile validate_media_registry.py
          python -m py_compile catalog_model.py
          python -m py_compile validate_catalog_model.py
          python -m py_compile validate_authority_boundaries.py
          python -m py_compile audit_authority_surface.py
          python -m py_compile build_plan_pages_v3.py
          python -m py_compile validate_v3_preview.py
          python -m py_compile build_product_pages_v3.py
          python -m py_compile validate_v3_product_preview.py
          python -m py_compile build_public_info_v3.py
          python -m py_compile harden_public_info_v3.py
          python -m py_compile validate_public_info_v3.py
          python -m py_compile seed_plan_runtime.py
          python -m py_compile validate_commerce_worker.py
          python -m py_compile stamp_release.py
          python -m py_compile generate_release_manifest.py
          python -m py_compile verify_live.py

      - name: Check browser JavaScript syntax
        run: node --check assets/app.js

      - name: Validate protected authority boundaries
        run: python validate_authority_boundaries.py

      - name: Validate reviewed media registry
        run: python validate_media_registry.py

      - name: Validate v3 active catalog and quarantine model
        run: python validate_catalog_model.py

      - name: Inventory authority-sensitive legacy surfaces
        run: python audit_authority_surface.py

      - name: Inventory and route parity
        run: python inventory_site.py

      - name: Generate internal v3 plan previews
        run: python build_plan_pages_v3.py

      - name: Generate internal v3 product previews
        run: python build_product_pages_v3.py

      - name: Validate internal v3 plan previews
        run: python validate_v3_preview.py

      - name: Validate internal v3 product previews
        run: python validate_v3_product_preview.py

      - name: Generate strict L1 public-information artifact
        run: python build_public_info_v3.py

      - name: Harden strict L1 public-information artifact
        run: python harden_public_info_v3.py

      - name: Stamp strict artifact with exact Git SHA
        run: python stamp_release.py

      - name: Check strict L1 browser JavaScript syntax
        run: node --check _public_v3/assets/app.js

      - name: Validate strict L1 public-information artifact
        run: python validate_public_info_v3.py

      - name: Gate strict L1 release authority
        run: python validate_l1_release.py

      - name: Generate fail-closed D1 plan seed
        run: python seed_plan_runtime.py

      - name: Validate shadow commerce posture
        run: python validate_commerce_worker.py

      - name: Test shadow Worker quote authority
        run: node commerce-worker/test.mjs

      - name: Verify legacy staging remains bounded
        run: python stage_deploy.py

      - name: Stage strict L1 release candidate
        run: python stage_deploy.py --public-v3

      - name: Generate cryptographic release manifest
        run: python generate_release_manifest.py

      - name: Validate staged release integrity
        run: python validate_release.py

      - name: Verify strict release candidate boundaries
        run: |
          test ! -e _site/_preview_v3
          test ! -e _site/_public_v3
          test ! -e _site/commerce-worker
          test ! -e _site/data
          test ! -e _site/catalog.json
          test ! -e _site/aips-live.json
          test ! -e _site/assets/catalog.js
          test ! -e _site/checkout.html
          test ! -e _site/track.html
          if find _site -type f -name '*.json' -print -quit | grep -q .; then
            echo 'Unexpected JSON found in strict release candidate:'
            find _site -type f -name '*.json' -print
            exit 1
          fi

      - name: Verify strict candidate required files
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/sw.js
          test -f _site/assets/app.js
          test -f _site/assets/style.css
          test -f _release_meta/release-manifest.json
          grep -q '^release_mode=L1_PUBLIC_INFO_ONLY$' _site/BUILD-MANIFEST.txt
          grep -q "^git_sha=${GITHUB_SHA}$" _site/BUILD-MANIFEST.txt

      - name: Upload strict L1 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: saveonsub-l1-public-info-${{ github.sha }}
          path: |
            _site
            _release_meta
          if-no-files-found: error
          retention-days: 14

  cloudflare-credential-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Cloudflare credential only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Credential probe is read-only
        if: always()
        run: echo 'No Cloudflare resource was created, changed, deployed, or deleted by this job.'

  release-integrity-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate active model and authority
        run: |
          python validate_authority_boundaries.py
          python validate_media_registry.py
          python validate_catalog_model.py

      - name: Build strict artifact for independent release gate
        run: |
          python build_public_info_v3.py
          python harden_public_info_v3.py
          python stamp_release.py
          python validate_public_info_v3.py
          python validate_l1_release.py
          python stage_deploy.py --public-v3

      - name: Validate deployable release integrity
        run: python validate_release.py
