name: Remove Unused Public Market Intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-unused-market-intelligence.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify metadata is not consumed by hand-written runtime/build code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles=('market_survey','competitor_watchlist')
          consumers=[]
          generated={'assets/catalog.js'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('.git','.github','_site','node_modules')):
                  continue
              rel=p.as_posix()
              if p.name=='catalog.json' or rel in generated: continue
              if p.suffix.lower() not in {'.py','.js','.html','.htm','.json'}: continue
              try: text=p.read_text(encoding='utf-8',errors='ignore')
              except OSError: continue
              if any(n in text for n in needles): consumers.append(rel)
          print('handwritten_market_metadata_consumers=',len(consumers))
          for p in consumers: print('CONSUMER',p)
          if consumers:
              raise SystemExit('Not removing metadata: active hand-written consumer exists.')
          PY

      - name: Remove only internal meta market-survey block and regenerate browser catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('catalog.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          meta=data.get('meta',{})
          removed=meta.pop('market_survey',None)
          if removed is None:
              print('catalog.meta.market_survey already absent')
          else:
              print('removed catalog.meta.market_survey; product-level market.surveyed retained')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 build_catalog.py

      - name: Add permanent current-branch data-minimization guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('truth_guard.py')
          s=p.read_text(encoding='utf-8')
          marker="    # Approved identity must remain the build source of truth.\n"
          block="""    # Public-repository data boundary: internal market-research metadata\n    # must not be committed into the customer catalog or browser catalog.\n    catalog = ROOT / 'catalog.json'\n    if catalog.exists():\n        ctext = catalog.read_text(encoding='utf-8', errors='replace')\n        for key in ('\\\"market_survey\\\"', '\\\"competitor_watchlist\\\"'):\n            if key in ctext:\n                hits.append(('catalog.json', key, 'internal market-research metadata must stay outside the public catalog'))\n    public_catalog = ROOT / 'assets/catalog.js'\n    if public_catalog.exists():\n        ptext = public_catalog.read_text(encoding='utf-8', errors='replace')\n        for key in ('market_survey', 'competitor_watchlist'):\n            if key in ptext:\n                hits.append(('assets/catalog.js', key, 'internal market-research metadata leaked into browser catalog'))\n\n"""
          if 'Public-repository data boundary' not in s:
              if marker not in s: raise SystemExit('truth_guard insertion marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Prove build remains equivalent and safe
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python check_prices.py
          python stage_deploy.py
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/index.html
          ! grep -q 'market_survey\|competitor_watchlist' catalog.json
          ! grep -q 'market_survey\|competitor_watchlist' assets/catalog.js
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py

      - name: Commit current-branch data minimization
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add catalog.json assets/catalog.js truth_guard.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: minimize public catalog market intelligence'
          git push origin HEAD:main
