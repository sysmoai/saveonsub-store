name: Final P0 Truth and SSOT Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-p0-truth-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic truth and SSOT fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          excluded = {'.git','.github','.vercel','.wrangler','.astro','.next','node_modules','_site'}
          replacements = {
              "Yes — Bangladesh's trusted subscription OS, replacement within 1 hour, and honest risk labels on every plan. Nervous? Use our pay-after-testing option on your first order.":
                  "SaveOnSub publishes clearly labeled access types, written warranty terms and a public support channel. If you are nervous on your first order, check whether pay-after-testing is available for that product before paying.",
              "Bangladesh's trusted subscription OS, public WhatsApp, verifiable brand family (SYSmoAI, aipremiumshop.com). First order and nervous? Use <b>pay-after-testing</b> — we send access before you pay. Availability varies by product; the exact access and payment terms are shown before you order.":
                  "SaveOnSub publishes a public WhatsApp support channel, clearly labeled access types and written warranty terms. For a first order, check whether <b>pay-after-testing</b> is available for that product before paying. Availability varies by product; the exact access and payment terms are shown before you order.",
              "Send money to our merchant number with your order ID.":
                  "Send money to the payment number shown at checkout with your order ID.",
              "At checkout you get our merchant number with a copy button and your order ID as reference.":
                  "At checkout you get the current payment number with a copy button and your order ID as reference.",
              "merchant number": "payment number shown at checkout",
              "মার্চেন্ট নম্বর": "চেকআউটে দেখানো পেমেন্ট নম্বর",
          }

          changed=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.py','.html','.htm','.js'}:
                  continue
              if any(part in excluded for part in p.parts):
                  continue
              try:
                  old=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new=old
              for a,b in replacements.items():
                  new=new.replace(a,b)
              if new!=old:
                  p.write_text(new,encoding='utf-8')
                  changed.append(p.as_posix())
          print('truth wording changed:', len(changed))
          for x in changed[:50]: print(' ',x)

          # build_home.py consumes canonical non-secret phone constants.
          p=Path('build_home.py')
          s=p.read_text(encoding='utf-8')
          if 'from site_config import SUPPORT_PHONE_E164, SUPPORT_PHONE_DISPLAY' not in s:
              s=s.replace('import json, html\n', 'import json, html\nfrom site_config import SUPPORT_PHONE_E164, SUPPORT_PHONE_DISPLAY\n', 1)
          s=s.replace('\\"telephone\\":\\"+8801305869242\\"', '\\"telephone\\":\\"{SUPPORT_PHONE_E164}\\"')
          s=s.replace('+880 1305-869242 · verify before paying', '{SUPPORT_PHONE_DISPLAY} · verify before paying')
          p.write_text(s,encoding='utf-8')

          # Permanently block reintroduction of the two newly retired claims.
          p=Path('truth_guard.py')
          s=p.read_text(encoding='utf-8')
          marker="    'No shortcuts.': 'blanket official-only positioning conflicts with disclosed shared plans',\n"
          additions=(
              "    'merchant number': 'account type is not independently verified; use neutral checkout payment wording',\n"
              "    'মার্চেন্ট নম্বর': 'account type is not independently verified; use neutral checkout payment wording',\n"
              "    \"Bangladesh's trusted subscription OS\": 'unsupported trust-superlative claim; use verifiable facts instead',\n"
          )
          if "'merchant number':" not in s:
              if marker not in s: raise SystemExit('truth_guard insertion marker not found')
              s=s.replace(marker, marker+additions, 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Regenerate homepage from corrected generator
        run: python3 build_home.py

      - name: Validate full production staging
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python build_assets.py
          python check_prices.py
          python stage_deploy.py
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/index.html
          ! grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=_site -E 'merchant number|মার্চেন্ট নম্বর|Bangladesh.s trusted subscription OS' .
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py

      - name: Commit source-of-truth fixes
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add -A -- ':!.github/workflows/final-p0-truth-cleanup.yml'
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'fix: neutralize unverified payment and trust claims'
          git push origin HEAD:main
