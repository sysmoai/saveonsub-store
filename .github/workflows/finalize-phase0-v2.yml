name: Finalize Phase 0 V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-phase0-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch permanent production sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # templates.py: future generated pages use the approved locked logo directly.
          p = Path('templates.py')
          s = p.read_text(encoding='utf-8')
          if 'from site_config import SUPPORT_EMAIL, WHATSAPP_URL' not in s:
              s = s.replace('import html\n', 'import html\nfrom site_config import SUPPORT_EMAIL, WHATSAPP_URL\n', 1)
          s = s.replace(
              '<a class="logo" href="{rel}index.html">SAVE<em>ON</em>SUB</a>',
              '<a class="logo" href="{rel}index.html" aria-label="SaveOnSub home"><img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:155px;max-width:42vw;height:auto"></a>'
          )
          s = s.replace(
              '<a class="logo" href="{rel}bn.html">SAVE<em>ON</em>SUB</a>',
              '<a class="logo" href="{rel}bn.html" aria-label="SaveOnSub home"><img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:155px;max-width:42vw;height:auto"></a>'
          )
          s = s.replace(
              '<span class="logo">SAVE<em>ON</em>SUB</span>',
              '<img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:180px;max-width:100%;height:auto">'
          )
          s = s.replace('href="https://wa.me/8801305869242">WhatsApp</a>', 'href="{WHATSAPP_URL}">WhatsApp</a>')
          s = s.replace('href="mailto:support@saveonsub.com">Email</a>', 'href="mailto:{SUPPORT_EMAIL}">Email</a>')
          p.write_text(s, encoding='utf-8')

          # stage_deploy.py: derive the icon from the exact approved lockup master,
          # not from a separately embedded raster. This removes the corrupt-favicon
          # failure mode without redrawing any brand artwork.
          p = Path('stage_deploy.py')
          s = p.read_text(encoding='utf-8')
          old = "    icon = _embedded_png(assets / 'favicon.svg')\n    lockup = _embedded_png(assets / 'logo.svg')\n"
          new = "    lockup = _embedded_png(assets / 'logo.svg')\n    icon = lockup.crop((0, 0, lockup.height, lockup.height))\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif "icon = lockup.crop((0, 0, lockup.height, lockup.height))" not in s:
              raise SystemExit('stage_deploy icon-source marker changed unexpectedly')

          if 'EXCLUDE_PREFIXES' not in s:
              marker = "EXCLUDE_FILES = {'.replit', '.gitignore', '.env.example', 'catalog.json',\n                 'package.json', 'package-lock.json', 'vercel.json', 'AGENTS.md'}\n"
              if marker not in s:
                  raise SystemExit('stage_deploy EXCLUDE_FILES marker not found')
              s = s.replace(marker, marker + "EXCLUDE_PREFIXES = ('assets/social/',)\n", 1)

          old = "        new = old.replace('SAVE<em>ON</em>SUB', replacement)\n"
          if "https://saveonsub.com/assets/og-image.png" not in s[s.find('def apply_brand_lock'):s.find('def _embedded_png')]:
              if old not in s:
                  raise SystemExit('stage_deploy brand replacement marker not found')
              s = s.replace(old, old + "        new = re.sub(r'https://saveonsub\\.com/assets/social/[^\\\"\\\'\\s<]+\\.png', 'https://saveonsub.com/assets/og-image.png', new)\n", 1)

          old = "            rel = (rel_base / fn).as_posix().lstrip('./')\n            if rel in keep:\n"
          if "rel.startswith(EXCLUDE_PREFIXES)" not in s:
              if old not in s:
                  raise SystemExit('stage_deploy copy-loop marker not found')
              s = s.replace(old, "            rel = (rel_base / fn).as_posix().lstrip('./')\n            if rel.startswith(EXCLUDE_PREFIXES):\n                continue\n            if rel in keep:\n", 1)
          p.write_text(s, encoding='utf-8')

          # deploy.yml: add a manual recovery trigger, suppress docs-only deployment
          # noise, and install the pinned Pillow dependency used by staging.
          p = Path('.github/workflows/deploy.yml')
          s = p.read_text(encoding='utf-8')
          old = "on:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n"
          new = "on:\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths-ignore:\n      - 'ops/**'\n      - '**/*.md'\n  pull_request:\n    branches: [main]\n    paths-ignore:\n      - 'ops/**'\n      - '**/*.md'\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'workflow_dispatch:' not in s:
              raise SystemExit('deploy trigger block changed unexpectedly')

          setup = "      - name: Setup Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n\n"
          dep = "      - name: Install build dependencies\n        run: python -m pip install --disable-pip-version-check -r requirements.txt\n\n"
          if 'Install build dependencies' not in s:
              if setup not in s:
                  raise SystemExit('deploy Python setup marker not found')
              s = s.replace(setup, setup + dep, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate permanent production staging
        shell: bash
        run: |
          set -euo pipefail
          python build_assets.py
          python check_prices.py
          python stage_deploy.py
          test -f _site/assets/apple-touch-icon.png
          test -f _site/assets/icon-192.png
          test -f _site/assets/icon-512.png
          test -f _site/assets/og-image.png
          test ! -d _site/assets/social
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          if grep -RIl 'assets/social/' _site --include='*.html' | grep -q .; then
            echo 'Legacy social-card URL remained in staged HTML.' >&2
            exit 1
          fi

      - name: Commit permanent fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add templates.py stage_deploy.py .github/workflows/deploy.yml
          git rm -f .github/workflows/finalize-phase0-v2.yml
          if [ -f .github/workflows/phase0-system-finalize.yml ]; then git rm -f .github/workflows/phase0-system-finalize.yml; fi
          if [ -f .github/workflows/brand-derivative-debug.yml ]; then git rm -f .github/workflows/brand-derivative-debug.yml; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: finalize approved-brand staging and deployment controls'
          git push origin HEAD:main
