name: Apply Phase 0 Source Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-phase0-source-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply proven source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('stage_deploy.py')
          s = p.read_text(encoding='utf-8')
          old = "    icon = _embedded_png(assets / 'favicon.svg')\n    lockup = _embedded_png(assets / 'logo.svg')\n"
          new = "    lockup = _embedded_png(assets / 'logo.svg')\n    icon = lockup.crop((0, 0, lockup.height, lockup.height))\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif "icon = lockup.crop((0, 0, lockup.height, lockup.height))" not in s:
              raise SystemExit('stage_deploy icon-source marker changed unexpectedly')

          if 'EXCLUDE_PREFIXES' not in s:
              marker = "EXCLUDE_FILES = {'.replit', '.gitignore', '.env.example', 'catalog.json',\n                 'package.json', 'package-lock.json', 'vercel.json', 'AGENTS.md'}\n"
              if marker not in s:
                  raise SystemExit('stage_deploy EXCLUDE_FILES marker not found')
              s = s.replace(marker, marker + "EXCLUDE_PREFIXES = ('assets/social/',)\n", 1)

          old = "        new = old.replace('SAVE<em>ON</em>SUB', replacement)\n"
          if "https://saveonsub.com/assets/og-image.png" not in s[s.find('def apply_brand_lock'):s.find('def _embedded_png')]:
              if old not in s:
                  raise SystemExit('stage_deploy brand replacement marker not found')
              s = s.replace(old, old + "        new = re.sub(r'https://saveonsub\\.com/assets/social/[^\\\"\\\'\\s<]+\\.png', 'https://saveonsub.com/assets/og-image.png', new)\n", 1)

          old = "            rel = (rel_base / fn).as_posix().lstrip('./')\n            if rel in keep:\n"
          if "rel.startswith(EXCLUDE_PREFIXES)" not in s:
              if old not in s:
                  raise SystemExit('stage_deploy copy-loop marker not found')
              s = s.replace(old, "            rel = (rel_base / fn).as_posix().lstrip('./')\n            if rel.startswith(EXCLUDE_PREFIXES):\n                continue\n            if rel in keep:\n", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('templates.py')
          s = p.read_text(encoding='utf-8')
          if 'from site_config import SUPPORT_EMAIL, WHATSAPP_URL' not in s:
              s = s.replace('import html\n', 'import html\nfrom site_config import SUPPORT_EMAIL, WHATSAPP_URL\n', 1)
          s = s.replace(
              '<a class="logo" href="{rel}index.html">SAVE<em>ON</em>SUB</a>',
              '<a class="logo" href="{rel}index.html" aria-label="SaveOnSub home"><img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:155px;max-width:42vw;height:auto"></a>'
          )
          s = s.replace(
              '<a class="logo" href="{rel}bn.html">SAVE<em>ON</em>SUB</a>',
              '<a class="logo" href="{rel}bn.html" aria-label="SaveOnSub home"><img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:155px;max-width:42vw;height:auto"></a>'
          )
          s = s.replace(
              '<span class="logo">SAVE<em>ON</em>SUB</span>',
              '<img src="{rel}assets/logo.svg" alt="SaveOnSub.com" data-brand-lock="2026-08-19-approved" style="display:block;width:180px;max-width:100%;height:auto">'
          )
          s = s.replace('href="https://wa.me/8801305869242">WhatsApp</a>', 'href="{WHATSAPP_URL}">WhatsApp</a>')
          s = s.replace('href="mailto:support@saveonsub.com">Email</a>', 'href="mailto:{SUPPORT_EMAIL}">Email</a>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python build_assets.py
          python check_prices.py
          python stage_deploy.py
          test -f _site/assets/apple-touch-icon.png
          test -f _site/assets/icon-192.png
          test -f _site/assets/icon-512.png
          test -f _site/assets/og-image.png
          test ! -d _site/assets/social

      - name: Commit source fixes only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add stage_deploy.py templates.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finalize approved-brand source staging'
          git push origin HEAD:main
