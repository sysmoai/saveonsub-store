name: SaveOnSub Business OS validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-business-os:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check staff-ui/business.js
      - run: node --import ./tests/order-os/register.mjs --test tests/order-os/*.test.mjs
      - run: python audit_order_os.py
      - run: python -m pip install -r requirements.txt
      - name: Verify private review files stay outside storefront
        run: |
          mkdir -p .local
          printf 'SYNTHETIC PRIVATE QA SENTINEL' > .local/do-not-ship.txt
          python stage_deploy.py
          python - <<'PY'
          from pathlib import Path
          root=Path('_site')
          for name in ['.local','staff-ui','functions','ops','tests','workers']:
              assert not (root/name).exists(), name
          assert Path('staff-ui/assets/logo.svg').read_bytes()==Path('assets/logo.svg').read_bytes()
          PY
      - run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/sos-business-functions.mjs
      # Validation only. No deployment, credentials or production DB access.
      - name: Acceptance against the built governed catalog (synthetic data)
        run: |
          python build_site.py
          python audit_order_os.py
          node --import ./tests/order-os/register.mjs --test tests/order-os/built-catalog.test.mjs
          python - <<'PY'
          from pathlib import Path
          root=Path('_site')
          for name in ['staff-ui','functions','ops','tests','workers']:
              assert not (root/name).exists(), name
          for bad in ['aips-live.json','catalog.json','wrangler.order-os.toml']:
              assert not (root/bad).exists(), bad
          js=(root/'assets/order-v2.js').read_text()
          assert 'if(!cfg.serverCheckoutEnabled||!cfg.turnstileSiteKey) return;' in js[:400]
          PY
