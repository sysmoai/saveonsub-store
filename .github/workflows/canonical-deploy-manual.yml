name: SaveOnSub Canonical Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: saveonsub-canonical-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 4ca6269edabb6ad2906d70ec6845de22

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Capture exact release SHA
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run repository truth and regression gates
        run: |
          set -euo pipefail
          python check_prices.py
          python audit_all.py
          python deploy_preflight.py

      - name: Build exact hardened public artifact
        run: |
          set -euo pipefail
          python build_site.py
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/assets/measurement.js
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          grep -q 'User-agent: OAI-SearchBot' _site/robots.txt
          grep -q 'data-google-ai-facts="2026-09-09"' _site/p/google-ai-pro.html
          grep -q 'Google Bangladesh: ৳2,500/mo' _site/p/google-ai-pro.html
          grep -q '5 TB' _site/p/google-ai-pro.html
          grep -q 'data-chatgpt-facts="2026-09-07"' _site/p/chatgpt-plus.html
          grep -q 'data-canva-facts="2026-09-08"' _site/p/canva-pro.html
          grep -q 'data-midjourney-facts="2026-09-08"' _site/p/midjourney.html
          grep -q 'data-claude-facts="2026-09-09"' _site/p/claude-pro.html
          grep -q 'data-supergrok-facts="2026-09-09"' _site/p/supergrok.html
          grep -q 'data-perplexity-facts="2026-09-09"' _site/p/perplexity-pro.html
          grep -q 'data-entertainment-facts="2026-09-09"' _site/p/netflix.html
          grep -q 'data-entertainment-facts="2026-09-09"' _site/p/spotify.html
          grep -q 'data-entertainment-facts="2026-09-09"' _site/p/youtube-premium.html
          grep -q 'data-entertainment-guide-facts="2026-09-09"' _site/blog/netflix-spotify-youtube-premium-price-bd.html
          grep -q 'Netflix BD: US$2.99–US$9.99/month' _site/p/netflix.html
          grep -q 'Spotify BD: Individual ৳219/mo' _site/p/spotify.html
          grep -q 'YouTube Premium: available in Bangladesh' _site/p/youtube-premium.html
          grep -q '<link rel="canonical" href="https://saveonsub.com/p/chatgpt-plus">' _site/p/chatgpt-plus.html
          grep -q '<meta name="robots" content="noindex,follow">' _site/checkout.html
          grep -q 'favicon-32.png" type="image/png"' _site/p/chatgpt-plus.html
          ! grep -R -q 'Commonly searched as' _site --include='*.html'
          ! grep -R -q '<meta name="keywords"' _site --include='*.html'
          ! grep -q 'https://saveonsub.com/.*\.html' _site/sitemap.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify exact Cloudflare Pages access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Human credential repair is required."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf-project.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/saveonsub" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare Pages authorization failed (HTTP ${code}). Do not retry or bypass; repair the token/permission first."
            exit 1
          fi
          python - <<'PY'
          import json, sys
          d=json.load(open('/tmp/cf-project.json'))
          r=d.get('result') or {}
          if not d.get('success') or r.get('name') != 'saveonsub':
              print('::error::Token did not verify exact Pages project saveonsub.', file=sys.stderr)
              raise SystemExit(1)
          print("Verified Cloudflare Pages project 'saveonsub'.")
          PY

      - name: Deploy hardened artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler pages deploy _site --project-name=saveonsub --branch=main --commit-hash="$DEPLOY_SHA"

      - name: Verify canonical production
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            curl -fsSL --max-time 20 https://saveonsub.com/ -o /tmp/home.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/robots.txt -o /tmp/robots.txt || true
            curl -fsSL --max-time 20 https://saveonsub.com/sitemap.xml -o /tmp/sitemap.xml || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/google-ai-pro -o /tmp/google-ai.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/chatgpt-plus -o /tmp/chatgpt.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/claude-pro -o /tmp/claude.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/supergrok -o /tmp/supergrok.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/perplexity-pro -o /tmp/perplexity.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/netflix -o /tmp/netflix.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/spotify -o /tmp/spotify.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/p/youtube-premium -o /tmp/youtube.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/blog/netflix-spotify-youtube-premium-price-bd -o /tmp/entertainment-guide.html || true
            curl -fsSL --max-time 20 https://saveonsub.com/checkout -o /tmp/checkout.html || true
            if grep -q 'User-agent: OAI-SearchBot' /tmp/robots.txt 2>/dev/null \
              && grep -q '/assets/measurement.js' /tmp/home.html 2>/dev/null \
              && grep -q 'data-google-ai-facts="2026-09-09"' /tmp/google-ai.html 2>/dev/null \
              && grep -q 'Google Bangladesh: ৳2,500/mo' /tmp/google-ai.html 2>/dev/null \
              && grep -q '5 TB' /tmp/google-ai.html 2>/dev/null \
              && grep -q 'data-chatgpt-facts="2026-09-07"' /tmp/chatgpt.html 2>/dev/null \
              && grep -q 'SHARED · POLICY RISK' /tmp/chatgpt.html 2>/dev/null \
              && grep -q 'data-claude-facts="2026-09-09"' /tmp/claude.html 2>/dev/null \
              && grep -q 'data-supergrok-facts="2026-09-09"' /tmp/supergrok.html 2>/dev/null \
              && grep -q 'data-perplexity-facts="2026-09-09"' /tmp/perplexity.html 2>/dev/null \
              && grep -q 'data-entertainment-facts="2026-09-09"' /tmp/netflix.html 2>/dev/null \
              && grep -q 'Netflix BD: US$2.99–US$9.99/month' /tmp/netflix.html 2>/dev/null \
              && grep -q 'data-entertainment-facts="2026-09-09"' /tmp/spotify.html 2>/dev/null \
              && grep -q 'Spotify BD: Individual ৳219/mo' /tmp/spotify.html 2>/dev/null \
              && grep -q 'data-entertainment-facts="2026-09-09"' /tmp/youtube.html 2>/dev/null \
              && grep -q 'YouTube Premium: available in Bangladesh' /tmp/youtube.html 2>/dev/null \
              && grep -q 'data-entertainment-guide-facts="2026-09-09"' /tmp/entertainment-guide.html 2>/dev/null \
              && grep -q 'href="https://saveonsub.com/p/chatgpt-plus"' /tmp/chatgpt.html 2>/dev/null \
              && grep -q '<meta name="robots" content="noindex,follow">' /tmp/checkout.html 2>/dev/null \
              && ! grep -q 'https://saveonsub.com/.*\.html' /tmp/sitemap.xml 2>/dev/null \
              && ! grep -q 'Commonly searched as' /tmp/chatgpt.html 2>/dev/null; then
              echo 'Canonical production verified.'
              exit 0
            fi
            sleep 15
          done
          echo '::error::Upload may have completed, but canonical saveonsub.com did not converge to the hardened release.'
          exit 1
