name: Compare Locked Brand Payload Hashes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-payload-hash.yml'
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret embedded image hashes
        run: |
          python3 - <<'PY'
          import base64, hashlib, re
          from pathlib import Path
          for rel in ('assets/favicon.svg','assets/logo.svg'):
              text=Path(rel).read_text(encoding='utf-8')
              m=re.search(r'href="data:image/png;base64,([A-Za-z0-9+/=]+)"',text)
              raw=base64.b64decode(m.group(1),validate=True)
              print(rel,'b64chars=',len(m.group(1)),'bytes=',len(raw),'sha256=',hashlib.sha256(raw).hexdigest(),'tail=',raw[-16:].hex())
          PY
