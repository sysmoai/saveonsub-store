name: Provider Truth Wave 1 Hardening

on:
  push:
    branches:
      - ops/catalog-truth-wave1-20260903
    paths:
      - .github/workflows/provider-truth-wave1-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/catalog-truth-wave1-20260903
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply hardening
        run: |
          python ops/provider-truth/harden_wave1.py
          python ops/provider-truth/harden_wave1_policy.py
      - name: Rebuild and audit
        run: bash build_all.sh && python cache_safe_brand.py && python truth_guard.py
      - name: Verify public artifact
        run: |
          set -euo pipefail
          ! grep -R -Fq 'Price-match guarantee:' _site --include='*.html'
          ! grep -R -Fq 'Every subscription is official' _site --include='*.html'
          ! grep -R -Fq '100% customer-owned' _site --include='*.html'
          ! grep -R -Fq '100% official' _site --include='*.html'
          ! grep -R -Fq 'our ৳500 is market leader' _site --include='*.html'
          ! grep -R -Fq '83% off special' _site --include='*.html'
          ! grep -R -Fq 'replacement within 1 hour' _site --include='*.html'
          ! grep -R -Fq 'not illegal for you under BD law' _site --include='*.html'
          ! grep -R -Fq 'activated on YOUR own account' _site --include='*.html'
          grep -Fq 'Personal (your Gmail)' _site/p/google-ai-pro.html
          grep -Fq '5 TB' _site/p/google-ai-pro.html
          grep -Fq 'Official: ~৳2,455/mo ($19.99)' _site/p/google-ai-pro.html
          grep -Fq 'Independent service notice:' _site/p/google-ai-pro.html
          grep -Fq 'written warranty/refund terms for the selected plan or order' _site/p/chatgpt-plus.html
          grep -Fq '/assets/logo-' _site/index.html
      - name: Commit hardening
        run: |
          set -euo pipefail
          git rm .github/workflows/provider-truth-wave1-hardening.yml
          git config user.name saveonsub-truth-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'truth: remove residual absolute and stale product claims'
          git push origin HEAD:ops/catalog-truth-wave1-20260903
