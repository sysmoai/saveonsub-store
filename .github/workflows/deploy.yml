name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: saveonsub-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the build if a retired price still appears next to its product
      # name in any shipped page.
      - name: Price consistency check
        run: python check_prices.py

      # Generated pages are committed and CI ships exactly what was reviewed.
      # stage_deploy.py creates the public-only _site directory and enforces the
      # locked SaveOnSub brand assets on every staged HTML page.
      - name: Stage publishable files
        run: python stage_deploy.py

      - name: Verify staged production surface
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          echo "Staged production surface verified."

      # Independent, read-only diagnostic. This runs before Cloudflare auth so
      # the CI log records what the canonical domain is actually serving even
      # when deployment credentials are broken.
      - name: Audit current canonical route
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          echo "=== DNS ==="
          getent ahostsv4 saveonsub.com | head -6 || true
          echo "=== HOMEPAGE ==="
          home_code=$(curl -LsS -D /tmp/sos-current-headers.txt -o /tmp/sos-current-home.html -w "%{http_code}" https://saveonsub.com/ || true)
          echo "HTTP ${home_code}"
          grep -Ei '^(server|cf-ray|cf-cache-status|x-vercel-id|x-vercel-cache|via|x-github-request-id|age|cache-control):' /tmp/sos-current-headers.txt || true
          if [ -s /tmp/sos-current-home.html ]; then
            echo "homepage_sha256=$(sha256sum /tmp/sos-current-home.html | cut -d' ' -f1)"
            if grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-current-home.html; then
              echo "homepage_brand_lock=approved"
            else
              echo "homepage_brand_lock=not-present"
            fi
          fi
          echo "=== LOGO ==="
          logo_code=$(curl -LsS -D /tmp/sos-logo-headers.txt -o /tmp/sos-current-logo.svg -w "%{http_code}" https://saveonsub.com/assets/logo.svg || true)
          echo "HTTP ${logo_code}"
          if grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-current-logo.svg 2>/dev/null; then
            echo "logo_brand_lock=approved"
          else
            echo "logo_brand_lock=not-present"
          fi
          echo "=== INTERNAL PATHS ==="
          for path in catalog.json build_assets.py .env; do
            code=$(curl -LsS -o /dev/null -w "%{http_code}" "https://saveonsub.com/${path}" || true)
            echo "HTTP ${code} /${path}"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g wrangler

      # Fail fast on an expired/revoked token, a wrong account ID, or missing
      # Pages access. This prevents authentication failures from being retried
      # as though they were transient rate limits.
      - name: Verify Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN GitHub Actions secret."
            exit 1
          fi

          token_http=$(curl -sS -o /tmp/cf-token.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$token_http" != "200" ]; then
            echo "::error::Cloudflare token verification failed with HTTP ${token_http}. Replace the GitHub Actions CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/cf-token.json'))
          result = data.get('result') or {}
          if not data.get('success') or result.get('status') != 'active':
              print('::error::Cloudflare API token is not active.', file=sys.stderr)
              sys.exit(1)
          print('Cloudflare API token is active.')
          PY

          project_http=$(curl -sS -o /tmp/cf-project.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/saveonsub" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$project_http" != "200" ]; then
            echo "::error::Token is active but cannot access the Cloudflare Pages project 'saveonsub' in the configured account (HTTP ${project_http}). Check the Account ID and grant Cloudflare Pages Edit/Pages Write access."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/cf-project.json'))
          result = data.get('result') or {}
          if not data.get('success') or result.get('name') != 'saveonsub':
              print("::error::Cloudflare Pages project verification failed.", file=sys.stderr)
              sys.exit(1)
          print("Cloudflare Pages project 'saveonsub' access verified.")
          PY

      # PRs run validation/staging but never deploy. Production publishing
      # happens only after code reaches main. Authentication errors fail fast;
      # bounded retries remain for genuine transient Cloudflare throttling.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          waits=(30 90)
          for attempt in 1 2 3; do
            echo "Cloudflare deploy attempt ${attempt}/3"
            if wrangler pages deploy _site --project-name=saveonsub --branch=main --commit-hash="$GITHUB_SHA" 2>&1 | tee /tmp/cf-deploy.log; then
              exit 0
            fi
            if grep -Eq 'Authentication error|Invalid access token|code: 10000|code: 9109' /tmp/cf-deploy.log; then
              echo "::error::Cloudflare authentication failed. Do not retry: replace/fix the API token first."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare deployment failed after 3 bounded attempts."
              exit 1
            fi
            wait_index=$((attempt - 1))
            wait_seconds=${waits[$wait_index]}
            echo "Transient deployment failure; waiting ${wait_seconds}s before retry."
            sleep "$wait_seconds"
          done

      # A release is not green merely because the upload succeeded. Verify the
      # canonical custom domain actually serves the approved identity and that
      # internal source files remain inaccessible.
      - name: Verify canonical production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            home_code=$(curl -LsS -o /tmp/sos-home.html -w "%{http_code}" https://saveonsub.com/ || true)
            logo_code=$(curl -LsS -o /tmp/sos-logo.svg -w "%{http_code}" https://saveonsub.com/assets/logo.svg || true)
            if [ "$home_code" = "200" ] && [ "$logo_code" = "200" ] \
              && grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-home.html \
              && grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-logo.svg; then
              ok=1
              break
            fi
            echo "Canonical production not updated yet; waiting 15s (${attempt}/4)."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::saveonsub.com did not serve the newly approved brand-locked release after deployment."
            exit 1
          fi

          for path in catalog.json build_assets.py; do
            code=$(curl -LsS -o /dev/null -w "%{http_code}" "https://saveonsub.com/${path}" || true)
            if [ "$code" != "404" ]; then
              echo "::error::Internal source path /${path} is publicly reachable (HTTP ${code})."
              exit 1
            fi
          done
          echo "Canonical production verified: approved branding live and internal source paths blocked."
