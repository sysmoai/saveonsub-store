name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fail closed on launch/commercial truth before any publishable output is staged.
      # Pull requests deliberately do not deploy; previews must use a separate, explicit workflow.
      - name: Release integrity gate
        run: python validate_release.py

      - name: Price consistency check
        run: python check_prices.py

      # Generated pages are committed. CI verifies/stages the reviewed output rather than
      # silently regenerating assets with a different local toolchain.
      - name: Stage publishable files
        run: python stage_deploy.py

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      # Deploy only the explicit staged public tree. Never deploy the repository root.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler pages deploy _site --project-name=saveonsub --branch=main
        continue-on-error: false
