name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the build if a retired price still appears next to its product
      # name in any shipped page.
      - name: Price consistency check
        run: python check_prices.py

      # Generated pages are committed and CI ships exactly what was reviewed.
      # stage_deploy.py creates the public-only _site directory and enforces the
      # locked SaveOnSub brand assets on every staged HTML page.
      - name: Stage publishable files
        run: python stage_deploy.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g wrangler

      # PRs run all validation/staging checks above but can never deploy.
      # Production publishing happens only after code reaches main by push/merge.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          waits=(20 40 80 120)
          for attempt in 1 2 3 4 5; do
            echo "Cloudflare deploy attempt ${attempt}/5"
            if wrangler pages deploy _site --project-name=saveonsub --branch=main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Cloudflare deployment failed after 5 attempts."
              exit 1
            fi
            wait_index=$((attempt - 1))
            wait_seconds=${waits[$wait_index]}
            echo "Transient deploy failure; waiting ${wait_seconds}s before retry."
            sleep "$wait_seconds"
          done
