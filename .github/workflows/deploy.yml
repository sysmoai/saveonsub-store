name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Price consistency check
        run: python check_prices.py

      - name: Stage publishable files
        run: python stage_deploy.py

      - name: Setup Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g wrangler

      # Production deploy is intentionally push-to-main only. Pull requests are
      # validation environments and MUST never publish to the live Cloudflare
      # Pages project.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler pages deploy _site --project-name=saveonsub --branch=main
        continue-on-error: false
