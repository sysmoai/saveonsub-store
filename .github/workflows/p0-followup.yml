name: P0 Guard Follow-up Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-followup.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove remaining guard-detected claims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('build_home.py'), Path('index.html'), Path('checkout.html'), Path('bn/checkout.html')]
          repl = {
            "No other BD store offers this.": "Availability varies by product; the exact access and payment terms are shown before you order.",
            "No. ChatGPT keeps each user's conversations completely private. Only the subscription cost is shared, never your data. For work-sensitive use, choose a Personal plan — it's on your own email.": "Privacy depends on the exact access method. We disclose whether you receive your own account/workspace seat or shared credentials before payment. Do not put sensitive information into shared-access products; choose a personal/customer-owned plan when privacy is critical.",
          }
          changed=[]
          for p in files:
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            old=s
            for a,b in repl.items():
              s=s.replace(a,b)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('changed:', ', '.join(changed) or 'none')
          PY
      - name: Verify permanent preflight
        run: python check_prices.py && python stage_deploy.py
      - name: Commit fixes
        shell: bash
        run: |
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add build_home.py index.html checkout.html bn/checkout.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remove remaining legacy exclusivity and privacy claims'
          git push origin HEAD:main
