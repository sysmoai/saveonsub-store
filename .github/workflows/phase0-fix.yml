name: Apply Phase 0 Truth Fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase0-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact P0 truth corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and '_site' not in p.parts]
          customer_html = [p for p in roots if p.suffix.lower() in {'.html', '.htm'}]
          source_files = [Path(x) for x in ['build_home.py','build_trust.py','templates.py','build_pages.py'] if Path(x).exists()]
          targets = list(dict.fromkeys(customer_html + source_files))

          privacy_en = ("Privacy depends on the exact access method. Before payment, we disclose whether you receive your own account/workspace seat or shared credentials. "
                        "Do not put sensitive information into any shared-access product. If privacy is critical, choose a personal/customer-owned plan.")
          privacy_bn = ("প্রাইভেসি নির্ভর করে অ্যাক্সেস মেথডের ওপর। কেনার আগে আমরা জানাই আপনি নিজের অ্যাকাউন্ট/ওয়ার্কস্পেস সিট পাচ্ছেন নাকি শেয়ার্ড ক্রেডেনশিয়াল। "
                        "কোনো শেয়ার্ড-অ্যাক্সেস প্রোডাক্টে সংবেদনশীল তথ্য না দেওয়াই নিরাপদ। সর্বোচ্চ প্রাইভেসি দরকার হলে পার্সোনাল/নিজস্ব অ্যাকাউন্ট নিন।")
          legal_shared_en = ("We do not give legal advice. Provider terms and applicable law can differ by service and access method. Shared credentials may violate a provider's terms. "
                             "We disclose the access method and known provider-policy restrictions before payment so you can decide whether the plan fits your risk tolerance.")
          legal_shared_bn = ("আমরা আইনি পরামর্শ দিই না। প্রোভাইডারের শর্ত ও প্রযোজ্য আইন সার্ভিস ও অ্যাক্সেস মেথডভেদে আলাদা হতে পারে। শেয়ার্ড ক্রেডেনশিয়াল প্রোভাইডারের শর্ত ভঙ্গ করতে পারে। "
                             "পেমেন্টের আগে অ্যাক্সেস মেথড ও জানা প্রোভাইডার-পলিসি সীমাবদ্ধতা জানাই, যাতে আপনি ঝুঁকি বুঝে সিদ্ধান্ত নিতে পারেন।")
          openai_en = ("ChatGPT Plus is $20/month on the web. OpenAI currently supports BDT-denominated web billing in Bangladesh; standard web payment methods include credit/debit cards, and available methods can vary by platform or checkout. "
                       "SAVEONSUB offers local-payment purchase paths on eligible plans. Before payment, check the product page for the exact access method and current SAVEONSUB price.")

          repl = {
            '✅ <b>100% official, customer-owned</b> on your own account': '🏷️ <b>Every plan clearly labeled</b>: Official · Personal · Shared',
            '100% official, customer-owned on your own account': 'Every plan clearly labeled: Official · Personal · Shared',
            "Bangladesh's Subscription Operating System — official, customer-owned subscriptions paid in BDT — Dhaka, Bangladesh.": "Bangladesh's Subscription Operating System — clearly labeled subscription options with local BDT payment support — Dhaka, Bangladesh.",
            'বাংলাদেশের সাবস্ক্রিপশন অপারেটিং সিস্টেম — অফিসিয়াল, গ্রাহক-নিয়ন্ত্রিত সাবস্ক্রিপশন — ঢাকা, বাংলাদেশ।': 'বাংলাদেশের সাবস্ক্রিপশন অপারেটিং সিস্টেম — পরিষ্কারভাবে লেবেল করা সাবস্ক্রিপশন অপশন ও BDT পেমেন্ট সাপোর্ট — ঢাকা, বাংলাদেশ।',
            '+৮৮০ ১৭১৪-৬৭২০৯৪': '+৮৮০ ১৩০৫-৮৬৯২৪২',
            '+880 1714-672094': '+880 1305-869242',
            '8801714672094': '8801305869242',
            '01714-672094': '01305-869242',
            "No. ChatGPT keeps every user's conversations private — other seat-holders cannot see your chats, history or custom instructions. Only the subscription cost is shared, never your data.": privacy_en,
            "No. ChatGPT keeps every user's conversations private. Only the subscription cost is shared — never your chat history.": privacy_en,
            'না। ChatGPT প্রত্যেকের কথোপকথন আলাদা ও প্রাইভেট রাখে — অন্য সিট-হোল্ডাররা আপনার চ্যাট, হিস্ট্রি বা কাস্টম ইনস্ট্রাকশন দেখতে পারে না। শুধু খরচটা শেয়ার হয়, ডেটা কখনো নয়।': privacy_bn,
            "No other BD store offers this — because they can't.": 'Availability depends on the product and first-order eligibility; ask before ordering.',
            'বাংলাদেশে আর কেউ এটা দেয় না।': 'প্রোডাক্ট ও প্রথম অর্ডারের যোগ্যতা অনুযায়ী এটি পাওয়া যায়; অর্ডারের আগে জেনে নিন।',
            "Scammers can't afford to do that.": 'On eligible orders, you can verify that access works before completing payment.',
            'স্ক্যামার এটা পারে না।': 'যোগ্য অর্ডারে পেমেন্ট সম্পন্ন করার আগে অ্যাক্সেস কাজ করছে কি না যাচাই করা যায়।',
            'Scammers cannot sustain those.': 'Those checks make a seller easier to verify and contact if something goes wrong.',
            'a 2-year track record': 'published policies and a persistent public support channel',
            'আর ২ বছরের ট্র্যাক রেকর্ড': 'এবং পাবলিক নীতিমালা ও স্থায়ী সাপোর্ট চ্যানেল',
            "It's not illegal for you — it's a violation of the provider's terms of service (their contract with the account holder), not BD law. Worst case for you: the seat gets reset and we replace it. We label this honestly so you decide with full information.": legal_shared_en,
            'আপনার জন্য এটা অবৈধ নয় — এটা প্রোভাইডারের শর্ত (তাদের সাথে অ্যাকাউন্ট হোল্ডারের চুক্তি) লঙ্ঘন, বাংলাদেশের আইন নয়। আপনার সবচেয়ে খারাপ পরিস্থিতি: সিট রিসেট হবে, আমরা রিপ্লেস করব। এটা আমরা সৎভাবে লিখে দিই যাতে পূর্ণ তথ্য নিয়ে সিদ্ধান্ত নেন।': legal_shared_bn,
            "ChatGPT Plus costs $20/month (~৳2,200 as of July 2026). OpenAI only accepts international Visa/Mastercard — no bKash, no Nagad. Bangladesh has roughly 3 million credit cards for 170 million people. Resellers are the only path for the other 167 million. We sell shared from ৳350 (84% cheaper, warranty) and personal from ৳2,990.": openai_en,
            'shared at ৳350': 'shared at ৳499',
            'shared from ৳350': 'shared from ৳499',
            'we sell at ৳350': 'we sell at ৳499',
            "Legally in Bangladesh: yes — no law prohibits reselling digital access. Practically: only if you understand provider ToS and can absorb seat-reset risk. We have helped 50+ people start small reseller operations — message WhatsApp for honest advice. But reselling without telling customers about shared-seat reality is scamming. Do not do it.": "We do not provide legal advice on reselling. Provider terms and applicable law vary by service and business model. If you resell any digital access, verify the provider's rules, disclose the access method truthfully, protect customer data, and get qualified legal advice when needed.",
            "FanFlix sells ChatGPT at ৳500, we sell at ৳350 with warranty. BD Subscription lists 250+ products. We publish the full picture because trust earns repeat customers, and repeat customers are the only business model that survives in BD.": "We publish current official/reference prices and, when we use market comparisons, we date and source them. The goal is to help customers compare the access method, price, warranty and risk — not to make unverifiable competitor claims.",
            "BD ecommerce crossed $4 billion in 2026. Mobile money (bKash 70M users, Nagad, Rocket) processes more transactions than cards by far. Digital subscriptions are one of the fastest-growing segments because every global service assumes credit card access. Honest resellers disclose the mechanism; dishonest ones sell 'lifetime Netflix ৳999' — impossible since Netflix charges monthly.": "Bangladesh has a large mobile-first digital-payment market, but we do not publish market-size claims without a dated source. SAVEONSUB focuses on the narrower problem we can verify directly: helping Bangladesh customers compare subscription access methods, prices, payment paths and support conditions clearly.",
            'FAQ — 22 Straight Answers | SAVEONSUB': 'FAQ — 30 Straight Answers | SAVEONSUB',
            '<link rel="alternate" hreflang="bn-bd" href="https://saveonsub.com/">': '<link rel="alternate" hreflang="bn-bd" href="https://saveonsub.com/bn.html">',
            'Official subscriptions. No shortcuts.': 'Official, personal and shared options are labeled before checkout.',
            ' — authentic, delivered to WhatsApp in 5–15 minutes, paid with bKash. Every plan honestly labeled. Every seat covered by warranty.': ' — clearly labeled by access method, delivered to WhatsApp, and payable through the options shown at checkout. Warranty terms are shown by plan.',
            '"description":"Bangladesh\'s honest premium subscription store — authentic subscriptions at affordable BD prices, paid with bKash/Nagad/Rocket."': '"description":"Bangladesh\'s subscription store — clearly labeled subscription options with local BDT payment support."',
            'The only BD store with <span class="grad-text">honest labels</span>.': 'A BD store built around <span class="grad-text">honest labels</span>.',
            "Nobody else in BD dares.": 'The access method and known risks are shown before payment.',
          }

          changed = {}
          for p in targets:
            try:
              s = p.read_text(encoding='utf-8')
            except Exception:
              continue
            before = s
            count = 0
            for old, new in repl.items():
              n = s.count(old)
              if n:
                s = s.replace(old, new)
                count += n
            if p.name in {'build_home.py','index.html'}:
              # Remove unsupported order/bestseller claims without disturbing layout or URLs.
              s = s.replace("<span class=\"cat\">#{p['bestseller_rank']} Bestseller</span>", "<span class=\"cat\">{esc(p['category'])}</span>")
              s = s.replace('<div class="ticker mt2"><span class="dotp"></span><span id="tick">211+ lifetime orders — Google AI Pro (our #1)</span></div>', '<div class="ticker mt2"><span class="dotp"></span><span id="tick">Every plan clearly labeled — Official · Personal · Shared</span></div>')
              s = s.replace('<span class="official">Official ChatGPT Plus: ৳{chat_off:,}/mo</span>\n      <span class="ours">Ours: ৳{chat_from}</span>\n      <span class="savepct">SAVE {save_pct}%</span>', '<span class="official">ChatGPT Plus web list: $20/mo</span>\n      <span class="ours">SAVEONSUB: ৳{chat_from}</span>\n      <span class="savepct">CHECK ACCESS TYPE</span>')
              s = s.replace('<span class="official">Official ChatGPT Plus: ৳2,200/mo</span>\n      <span class="ours">Ours: ৳499</span>\n      <span class="savepct">SAVE 77%</span>', '<span class="official">ChatGPT Plus web list: $20/mo</span>\n      <span class="ours">SAVEONSUB: ৳499</span>\n      <span class="savepct">CHECK ACCESS TYPE</span>')
              old_block = '''<div class="tcard"><b style="color:var(--gold);font-size:22px">1,600+</b><p style="margin-top:6px">orders delivered trusted in Bangladesh across our store family — every one via the same WhatsApp number that's still answering today.</p><div class="who">Verifiable: same +880 1305-869242 since day one</div></div>'''
              new_block = '''<div class="tcard"><b style="color:var(--gold);font-size:22px">Public support channel</b><p style="margin-top:6px">Questions, delivery issues and warranty requests route to the same SaveOnSub WhatsApp support number shown across this site.</p><div class="who">+880 1305-869242 · verify before paying</div></div>'''
              s = s.replace(old_block, new_block)
              old_block2 = '''<div class="tcard"><b style="color:var(--gold);font-size:22px">211 · 201 · 178</b><p style="margin-top:6px">lifetime orders of our top three products. Real counts from our order records — not invented reviews.</p><div class="who">We publish numbers, not fake stars</div></div>'''
              new_block2 = '''<div class="tcard"><b style="color:var(--gold);font-size:22px">Product facts first</b><p style="margin-top:6px">We publish plan type, access method, current price and warranty terms instead of manufacturing star ratings or popularity claims.</p><div class="who">Clear labels before payment</div></div>'''
              s = s.replace(old_block2, new_block2)
              # Generated homepage uses concrete values rather than f-string placeholders.
              s = s.replace('<span class="cat">#1 Bestseller</span>', '<span class="cat">AI Assistants</span>')
              s = s.replace('<span class="cat">#2 Bestseller</span>', '<span class="cat">AI Writing</span>')
              s = s.replace('<span class="cat">#3 Bestseller</span>', '<span class="cat">AI Image &amp; Design</span>')
              s = s.replace('<span class="cat">#4 Bestseller</span>', '<span class="cat">AI Image &amp; Design</span>')
              s = s.replace('<span class="cat">#5 Bestseller</span>', '<span class="cat">AI Assistants</span>')
            if s != before:
              p.write_text(s, encoding='utf-8')
              changed[str(p)] = count

          print('Changed files:', len(changed))
          for p, n in sorted(changed.items()):
            print(f'{p}: {n} exact replacements')
          PY

      - name: Validate public staging
        run: |
          python check_prices.py
          python stage_deploy.py
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env

      - name: Commit migration results
        shell: bash
        run: |
          set -e
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add build_home.py build_trust.py templates.py '*.html' bn p c blog 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No P0 content changes to commit.'
            exit 0
          fi
          git commit -m 'fix: correct P0 trust claims, privacy wording and contact consistency'
          git push origin HEAD:main
