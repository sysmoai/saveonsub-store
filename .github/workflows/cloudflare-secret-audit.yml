name: Audit Cloudflare Credential Paths

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-secret-audit.yml'

permissions:
  contents: read

jobs:
  audit-cloudflare-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_CURRENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_CF_API: ${{ secrets.CF_API_TOKEN }}
      TOKEN_PAGES: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      TOKEN_GENERIC: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_CF_PAGES: ${{ secrets.CF_PAGES_TOKEN }}
      HOOK_CF: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      HOOK_PAGES: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      HOOK_CF_PAGES: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
      HOOK_GENERIC: ${{ secrets.PAGES_DEPLOY_HOOK }}
      HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Verify credential aliases without exposing values
        shell: bash
        run: |
          set -u
          check_token() {
            label="$1"
            token="$2"
            if [ -z "$token" ]; then
              echo "${label}=missing"
              return 0
            fi
            code=$(curl -sS -o /tmp/cf-token-check.json -w "%{http_code}" \
              https://api.cloudflare.com/client/v4/user/tokens/verify \
              -H "Authorization: Bearer ${token}" || true)
            if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open('/tmp/cf-token-check.json')); r=d.get('result') or {}; sys.exit(0 if d.get('success') and r.get('status')=='active' else 1)"; then
              echo "${label}=valid-active"
            else
              echo "${label}=invalid-or-inactive-http-${code}"
            fi
          }
          check_present() {
            label="$1"
            value="$2"
            if [ -n "$value" ]; then echo "${label}=present"; else echo "${label}=missing"; fi
          }

          check_token CLOUDFLARE_API_TOKEN "$TOKEN_CURRENT"
          check_token CF_API_TOKEN "$TOKEN_CF_API"
          check_token CLOUDFLARE_PAGES_TOKEN "$TOKEN_PAGES"
          check_token CLOUDFLARE_TOKEN "$TOKEN_GENERIC"
          check_token CF_PAGES_TOKEN "$TOKEN_CF_PAGES"
          check_present CLOUDFLARE_DEPLOY_HOOK "$HOOK_CF"
          check_present CLOUDFLARE_PAGES_DEPLOY_HOOK "$HOOK_PAGES"
          check_present CF_PAGES_DEPLOY_HOOK "$HOOK_CF_PAGES"
          check_present PAGES_DEPLOY_HOOK "$HOOK_GENERIC"
          check_present DEPLOY_HOOK_URL "$HOOK_URL"
