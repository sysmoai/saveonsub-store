name: Corrected P0-P1 Truth and SEO Safety Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-truth-seo-safety-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def rep(path, old, new, required=True):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if required and n == 0: raise SystemExit(f'{path}: missing expected text {old[:120]!r}')
              if n: p.write_text(s.replace(old,new),encoding='utf-8')
              print('replace',path,n,old[:70])

          # ----- catalog customer-facing SSOT -----
          p=Path('catalog.json'); data=json.loads(p.read_text(encoding='utf-8'))
          m=data['meta']
          m['tos_risk_levels']={
            'official':'Provider-billed/official access path where available. Access is not shared by SaveOnSub; provider policies still apply.',
            'personal':'Personal/customer-specific access. Exact credential or invite method is shown before payment; lower sharing risk than shared access.',
            'shared-low':'Shared access with a separate profile/workspace where the product supports it. Privacy, continuity and provider-policy risk still depend on the service.',
            'shared-med':'Shared or multi-user access. Higher privacy/continuity risk; provider rules vary by service. SaveOnSub warranty terms apply as stated before payment.'
          }
          m['warranty']='SaveOnSub policy: replacement within 1 hour during support hours where the stated warranty applies; shared plans carry 7-day coverage and personal plans 30-day coverage unless a product page states otherwise.'
          byid={x['id']:x for x in data['products']}
          def setfaq(pid,prefix,answer):
              hits=[f for f in byid[pid].get('faq',[]) if f.get('q','').startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'{pid} {prefix}: FAQ matches={len(hits)}')
              hits[0]['a']=answer
          setfaq('chatgpt-plus','Will others see my chats','Privacy depends on the exact access method. Shared credentials can expose activity or data to other people with access. Do not use shared access for sensitive information; choose a personal/customer-specific plan when privacy is important.')
          setfaq('chatgpt-plus','Which plan should I pick','Work or sensitive data → choose a personal/customer-specific plan. Study or low-risk use → compare the shared options, current displayed savings, access method and warranty before ordering.')
          setfaq('chatgpt-plus','Which AI assistant is best','Choose by task and current provider features: compare ChatGPT, Claude, Gemini and Perplexity on their official pages, then check the SaveOnSub product page for access type and current BDT price. Buy a second tool only if it adds a capability you actually need.')
          setfaq('chatgpt-plus','What happens if the AI model gets updated','Provider features, models and limits can change. SaveOnSub updates product information after a material change is verified; available features remain subject to the provider and the exact plan/access method purchased.')
          setfaq('chatgpt-go','Go vs Plus','Go is the lower-cost ChatGPT tier and Plus is the higher-capability tier. Compare the current official feature matrix first; the current SaveOnSub Go option and BDT price are shown on this page.')
          setfaq('chatgpt-go','Who is ChatGPT Go for','ChatGPT Go is a lower-cost personal ChatGPT option for people who need more than the free tier but do not need every Plus capability. Check the current official feature matrix and this page’s current SaveOnSub price before choosing.')
          # Historical per-product order counts were being rendered as social proof and
          # shipped to the browser without an auditable source. Remove them from the public SSOT.
          for x in data['products']: x.pop('orders',None)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # ----- homepage generator: preserve real policy but scope it correctly -----
          rep('build_home.py',' — authentic subscriptions, bKash/Nagad, 5–15 min delivery, warranty. Official, personal and shared options are labeled before checkout.',' — clearly labeled subscription options with local BDT payment. Instant plans show a 5–15 min SLA; access type and warranty terms are shown before checkout.')
          rep('build_home.py','+ subscriptions at honest BD prices. bKash/Nagad, 5–15 min delivery, honest labels, warranty.','+ subscription options at BD prices. Local payment options, access labels and plan-specific delivery/warranty terms are shown before checkout.')
          rep('build_home.py','<span>⚡ <b>5–15 min</b> delivery</span>','<span>⚡ <b>Instant plans:</b> 5–15 min SLA</span>')
          rep('build_home.py','<span>🛡️ <b>1-hour</b> replacement warranty</span>','<span>🛡️ <b>Warranty:</b> replacement policy shown by plan</span>')
          rep('build_home.py','Ordered in <span class="grad-text">2 minutes</span>. Delivered in 15.','Order quickly. <span class="grad-text">Delivery follows the selected plan SLA.</span>')
          rep('build_home.py','One tap sends your order + payment info. A human replies in minutes — in Bangla or English.','One tap prepares your order + payment details for WhatsApp. Human support is available in Bangla or English.')
          rep('build_home.py','Credentials or invite arrive in 5–15 min (instant products). Warranty covers you from minute one.','Delivery follows the SLA shown on the selected plan: instant, fast or managed. Applicable warranty terms are shown before payment.')
          rep('build_home.py',"Student? Copilot is free for you — we'll show you how instead of selling it. That's why customers come back.","If a provider offers a free or student path that fits your use, check that first. Buy only when the paid option solves a real need.")
          rep('build_home.py','Rather than paste fake testimonials, judge us by <b style="color:var(--green2)">pay-after-testing</b> — we send access before you pay.','Rather than paste fake testimonials, check the access label, written terms and public support channel. If pay-after-testing is explicitly offered for your selected product, its process is confirmed before payment.')
          rep('build_home.py','{len(nonb)} products · bKash/Nagad · 5–15 min delivery · warranty on everything.','{len(nonb)} products · local BDT payment options · delivery SLA and warranty shown by plan.')

          # ----- product generator -----
          bp=Path('build_pages.py'); s=bp.read_text(encoding='utf-8')
          # Remove arbitrary build-date-derived price expiry and physical-goods return schema.
          s=re.sub(r'^PRICE_VALID = .*?\n# Honest merchant return policy.*?^tos_meta =', 'tos_meta =', s, count=1, flags=re.M|re.S)
          s=re.sub(r'\s*"priceValidUntil": PRICE_VALID,\s*', ' ', s)
          s=re.sub(r'\s*"hasMerchantReturnPolicy": RETURN_POLICY,\s*', ' ', s)
          if 'PRICE_VALID' in s or 'RETURN_POLICY' in s: raise SystemExit('build_pages: stale generated offer policy reference remains')
          # Remove unaudited order-count badges before catalog orders are removed.
          s=s.replace("{' · 🔥 '+str(p['orders'])+'+ orders' if p.get('orders',0)>100 else ''}",'')
          s=s.replace("{' · 🔥 '+str(p['orders'])+'+ অর্ডার' if p.get('orders',0)>100 else ''}",'')
          # Qualify English product metadata.
          s=s.replace("desc = f\"{name_clean} in Bangladesh from ৳{cheapest['bdt']:,}/{cheapest['duration']} (official ~৳{official_bdt:,}). bKash/Nagad, {sla_meta[cheapest['sla']]} delivery, warranty. Honest labels.\"",
                      "desc = f\"{name_clean} in Bangladesh from ৳{cheapest['bdt']:,}/{cheapest['duration']} (official reference ~৳{official_bdt:,}). Local BDT payment, {sla_meta[cheapest['sla']]} delivery for this plan; access and SaveOnSub warranty terms shown on-page.\"")
          # Qualify Bangla product metadata with the actual selected plan SLA.
          old_bn="desc = f\"{name_clean_bn} বাংলাদেশে ৳{frm:,} থেকে — বিকাশ/নগদ, ৫–১৫ মিনিটে ডেলিভারি, ১ ঘণ্টার ওয়ারেন্টি। সৎ দামে আসল সাবস্ক্রিপশন।\""
          new_bn="desc = f\"{name_clean_bn} বাংলাদেশে ৳{frm:,} থেকে — local BDT payment, {sla_bn(cheapest['sla'])} delivery। access type এবং প্রযোজ্য SaveOnSub warranty এই page-এ দেখানো আছে।\""
          if old_bn not in s: raise SystemExit('build_pages: Bangla meta description pattern missing')
          s=s.replace(old_bn,new_bn,1)
          # English market snapshot: historical and source-scoped, no competitor warranty/payment assumptions.
          pattern=re.compile(r'''        beat = ours_low <= mk\['low'\]\n        honesty = \("We're the cheapest surveyed option — AND the only one with a written warranty\." if beat else\n                   "Cheaper exists in the market — without pay-after-testing, written warranty or honest risk labels\. That's the trade; your call\."\)\n        market_html = f"""<h2 class="mt3" style="font-size:22px">BD Market Reality — \{esc\(name\)\}</h2>.*?\{honesty\}</p>"""''',re.S)
          replacement='''        position = "at or below" if ours_low <= mk['low'] else "within/above"\n        market_html = f"""<h2 class="mt3" style="font-size:22px">BD Market Snapshot — {esc(name)}</h2>\n  <div class="tbl mt2"><table>\n  <tr><th>Reference</th><th>Price</th><th>Notes</th></tr>\n  <tr><td>Official list converted at site anchor rate</td><td>~৳{official_bdt:,}/mo</td><td>Verify the current provider price at the official link above</td></tr>\n  <tr><td>BD market snapshot</td><td>৳{mk['low']:,} – ৳{mk['high']:,}</td><td>Historical survey; seller access/warranty terms can differ</td></tr>\n  <tr style="background:rgba(20,212,184,.07)"><td><b>SAVEONSUB</b></td><td><b>from ৳{ours_low:,}</b></td><td><b>Access type + SaveOnSub warranty shown before payment</b></td></tr>\n  </table></div>\n  <p style="font-size:13px;color:var(--muted);margin-top:8px">Last cited snapshot: {esc(mk['who'])} <i>(source: {esc(mk['src'])})</i>. At that snapshot, the current SaveOnSub from-price is {position} the cited range; verify current competitor pricing yourself before buying.</p>"""'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'build_pages: English market block matches={n}')
          # Bangla universal FAQ must not manufacture customer counts or absolute privacy.
          s=s.replace('f"হ্যাঁ — ২০২৪ সাল থেকে ৩,০০০+ কাস্টমার। প্রতিটি প্ল্যানে সৎ ঝুঁকির লেবেল দেওয়া, আর যেকোনো সমস্যায় ১ ঘণ্টার মধ্যে রিপ্লেসমেন্ট। প্রথমবার নার্ভাস? আগে টেস্ট করে তারপর টাকা দিন (pay-after-testing)।"',
                      '"অ্যাক্সেস পদ্ধতি, shared/personal ঝুঁকি এবং প্রযোজ্য warranty অর্ডারের আগে দেখুন। shared access-এ sensitive data ব্যবহার করবেন না। Pay-after-testing শুধু যে product/order-এ স্পষ্টভাবে offer করা হয় সেখানে প্রযোজ্য।"')
          s=s.replace('"না। শুধু সাবস্ক্রিপশনের খরচটাই শেয়ার হয় — আপনার চ্যাট, ফাইল বা ব্যক্তিগত ডেটা কেউ দেখে না।"',
                      '"নিশ্চিতভাবে বলা যায় না — privacy exact access method-এর ওপর নির্ভর করে। shared credentials-এ অন্য access holder activity বা data দেখতে পারে। sensitive information-এর জন্য personal/customer-specific plan নিন।"')
          s=s.replace('"সাপোর্ট আওয়ারে ১ ঘণ্টার মধ্যে রিপ্লেসমেন্ট। শেয়ার্ড সিটে ৭ দিন, পার্সোনাল প্ল্যানে ৩০ দিন গ্যারান্টি — লিখিতভাবে।"',
                      '"SaveOnSub policy অনুযায়ী applicable warranty-তে support hours-এর মধ্যে ১ ঘণ্টার replacement target আছে; shared coverage ৭ দিন এবং personal coverage ৩০ দিন, যদি product page-এ অন্য কিছু না লেখা থাকে।"')
          # Bangla market superlatives/payment assumptions.
          s=s.replace('''        beat = frm <= mk['low']\n        honesty = ("সার্ভে করা অপশনগুলোর মধ্যে আমরাই সবচেয়ে সস্তা — এবং একমাত্র লিখিত ওয়ারেন্টিসহ।" if beat else\n                   "বাজারে আরও সস্তা আছে — কিন্তু pay-after-testing, লিখিত ওয়ারেন্টি বা সৎ ঝুঁকির লেবেল ছাড়া। পছন্দ আপনার।")''',
                      '''        position = "cited range-এর সমান বা নিচে" if frm <= mk['low'] else "cited range-এর মধ্যে/উপরে"''')
          s=s.replace('<tr><td>অফিসিয়াল (কার্ড লাগবে)</td><td>~৳{official_bdt:,}/মাস</td><td>নেই</td></tr>', '<tr><td>Official list, site anchor rate-এ converted</td><td>~৳{official_bdt:,}/মাস</td><td>বর্তমান provider price official link-এ verify করুন</td></tr>')
          s=s.replace('<tr><td>বাংলাদেশ বাজার (সার্ভে করা)</td><td>৳{mk[\'low\']:,} – ৳{mk[\'high\']:,}</td><td>সাধারণত নেই/অস্পষ্ট</td></tr>', '<tr><td>বাংলাদেশ market snapshot</td><td>৳{mk[\'low\']:,} – ৳{mk[\'high\']:,}</td><td>Historical survey; seller access/warranty terms ভিন্ন হতে পারে</td></tr>')
          s=s.replace('{honesty}</p>"""','বর্তমান SaveOnSub from-price {position}; কেনার আগে competitor-এর current price নিজে verify করুন।</p>"""')
          bp.write_text(s,encoding='utf-8')

          # ----- trust/help generator -----
          bt=Path('build_trust.py'); t=bt.read_text(encoding='utf-8')
          R={
          "Fair question — BD is full of subscription scams. Proof: Bangladesh's Subscription OS trusted in Bangladesh, part of the verifiable SYSmoAI family (sysmoai.com, aipremiumshop.com), public WhatsApp with a human reply, and a <b>pay-after-testing</b> option where we send access BEFORE you pay. On eligible orders, you can verify that access works before completing payment.":"Check what can be verified before paying: the public support number, access label, current price, official-provider link where available, warranty/refund terms and whether pay-after-testing is explicitly offered for that product. SaveOnSub is an independent subscription seller/service; product trademarks belong to their owners.",
          "Two honest reasons: (1) shared plans split one subscription's cost across several users — that's the discount, and it's also why providers' terms don't allow it (the 'catch', which we label on every product and cover with warranty); (2) personal plans use regional pricing and bulk activation. We show the official price next to ours so you always see what you're saving and why.":"Lower prices can come from shared/multi-user access, regional pricing, bundles or seller sourcing. The trade-offs vary by provider. We show the access method and a comparison reference so you can judge risk and value before payment.",
          "<b>Official</b> = you pay the provider directly, we just guide/activate (e.g. Spotify BD ৳219). <b>Personal</b> = a subscription on YOUR OWN email — full control, lowest risk. <b>Shared</b> = a seat on a multi-user plan — 70-85% cheaper, provider terms prohibit it, so seats occasionally reset; our warranty replaces them within 1 hour.":"<b>Official</b> = provider-billed/official path where available. <b>Personal</b> = customer-specific access with lower sharing risk. <b>Shared</b> = multi-user/shared access with higher privacy/continuity risk. Exact provider rules, delivery SLA and SaveOnSub warranty are shown for the selected plan.",
          "Yes, it happens — that's the honest trade-off for the price. When it does: message us, replacement within 1 hour during support hours, 7-day guarantee on every shared seat. If we can't replace, you get a refund for unused days.":"Shared access can stop working because of provider, account or seat changes. Under the current SaveOnSub policy, applicable shared-plan warranty coverage is 7 days with a replacement target within 1 hour during support hours unless the product states otherwise; see the written warranty/refund pages for scope and exclusions.",
          "For nervous first-timers: we send the access first, you verify it works, then you pay within an hour. Available on most instant products for first orders. Availability depends on the product and first-order eligibility; ask before ordering.":"Pay-after-testing is not universal. If explicitly offered for the selected product/order, support confirms the exact sequence before payment. Otherwise use the standard checkout process.",
          "Never. There is no auto-charge — you pay manually each time. We send a WhatsApp reminder 3 days before expiry with a one-tap renewal link. Ignore it and the subscription simply lapses. Your money stays yours.":"The storefront does not automatically charge renewals. Renewal is manual: contact support before expiry if you want to continue. Do not rely on an automatic reminder unless one is explicitly confirmed for your order.",
          "Three honest ways: pay 3 months upfront (10% off), refer a friend (you both get ৳100 off), or students get ৳100 off ChatGPT personal plans with a student ID. Ask on WhatsApp.":"Discounts and promotional eligibility change. Check the current Offers page or ask support for the exact product and duration; do not assume a past student/referral/multi-month discount still applies.",
          "Same as official — you're using the real service. Shared seats sometimes limit simultaneous devices (shown on the product). Personal plans have no restrictions.":"Device/app support depends on the provider and exact access method. Check provider requirements and the selected product page; shared access may have additional device/session restrictions.",
          "Yes — pay the difference any time and we migrate you. Many customers start shared at ৳499, then upgrade to personal once the tool starts earning them money.":"An upgrade may be possible when a compatible personal option is available, but it is not automatic. Ask support for the current migration/price difference before paying.",
          "Yes — ChatGPT Business seats, bulk Canva, and custom team setups. Message WhatsApp with your team size; bulk pricing starts at 3+ seats (10-15% off).":"Business/team options vary by provider and current inventory. Message WhatsApp with provider and team size for a current quote; no blanket bulk-discount percentage is promised.",
          "It just stops — no auto-charge, no debt. You'll have gotten a WhatsApp reminder 3 days before. Renew with one tap or walk away; your choice, no pressure.":"The storefront does not auto-charge renewals. When the purchased duration ends, continued access depends on provider/access method. Contact support before expiry if you want to renew; do not rely on an automatic reminder.",
          "We operate online-first from Dhaka with registered company paperwork in progress (SYSmoAI). All support runs through WhatsApp with real humans — usually the founder's team directly.":"SaveOnSub operates online-first from Dhaka. Current support routes through the public WhatsApp/contact channels shown on this site; use those channels for order, warranty and refund requests.",
          "The seller blocks you and disappears. No brand, no website, no recourse. This happens thousands of times daily across BD subscription groups. Buy only from sellers with a real website, a written warranty, a refund policy, and a public WhatsApp number active for over a year. Those checks make a seller easier to verify and contact if something goes wrong.":"If a seller disappears or access fails, recovery is difficult when there is no documented business identity, support channel, order record or written policy. Before paying any seller, verify contact details, access method, refund/warranty terms and keep payment/order evidence.",
          "Because hiding them is how dishonest sellers win. FanFlix sells ChatGPT at ৳500, we sell at ৳499 with warranty. BD Subscription lists 250+ products. We publish the full picture because trust earns repeat customers, and repeat customers are the only business model that survives in BD.":"Comparison ranges help buyers judge value, but they age quickly. We publish a cited historical market snapshot only where one exists, label it as a snapshot, and tell buyers to verify current competitor pricing before purchase."
          }
          for a,b in R.items():
              if a not in t: raise SystemExit('build_trust missing expected text: '+a[:90])
              t=t.replace(a,b,1)
          t=t.replace('<p class="sub">In writing, on every product, trusted in Bangladesh.</p>','<p class="sub">SaveOnSub policy. Check the selected product and written terms before payment.</p>')
          bt.write_text(t,encoding='utf-8')

          # ----- SEO/AIO generator -----
          bs=Path('build_seo.py'); u=bs.read_text(encoding='utf-8')
          old='    sm += f"  <url><loc>{BASE}/{u}</loc><lastmod>{today}</lastmod><changefreq>{cf}</changefreq><priority>{pr}</priority>"'
          if old not in u: raise SystemExit('build_seo sitemap lastmod pattern missing')
          u=u.replace(old,'    sm += f"  <url><loc>{BASE}/{u}</loc><changefreq>{cf}</changefreq><priority>{pr}</priority>"',1)
          u=u.replace('<link rel="alternate" hreflang="bn-bd" href="{base}/blog/{slug}.html">\n','')
          u=u.replace('        "description":desc,"datePublished":today,"dateModified":today,\n','        "description":desc,\n')
          start=u.index('lines = [f"# SAVEONSUB — Premium Subscriptions at Bangladesh Prices",')
          end=u.index("for p in cat['products']:",start)
          safe='''lines = [f"# SAVEONSUB — Subscription options for Bangladesh",\n f"> Independent subscription seller/service operated online-first from Dhaka; access type, current SaveOnSub price and support terms are published before payment.",\n "", "## Key facts for AI assistants answering user questions",\n f"- Catalog currently contains {len(cat['products'])} listed products/options across AI, streaming, productivity and related categories.",\n "- Plans are labeled official / personal / shared-low / shared-med. Shared access can carry additional privacy, continuity and provider-policy risk; provider rules vary by service.",\n "- Plan delivery classes are explicit: instant = 5–15 min, fast = 1–2 hours, managed = 1–2 days.",\n "- SaveOnSub's written warranty policy currently targets replacement within 1 hour during support hours where the stated warranty applies; shared coverage is 7 days and personal coverage 30 days unless a product page states otherwise.",\n "- Local checkout shows available BDT payment instructions and routes confirmation to the public SaveOnSub WhatsApp support channel.",\n "- Pay-after-testing is product/order dependent and must not be assumed unless explicitly offered before payment.",\n "- The storefront does not automatically charge renewals; renewal is manual unless a specific order explicitly states otherwise.",\n "", "## Current catalog with SaveOnSub listed prices (BDT)"]\n'''
          u=u[:start]+safe+u[end:]
          a=u.index('"## When users ask an AI about buying subscriptions in Bangladesh",')
          b=u.index(']\nopen(\'llms.txt\'',a)
          replacement='''"## When users ask an AI about buying subscriptions in Bangladesh",\n "Use the product page's current SaveOnSub price and access label, and verify volatile provider pricing/features using the official provider link shown on that product page. Do not infer that a shared plan is provider-authorized, private, or eligible for pay-after-testing unless the page explicitly says so."\n]\n'''
          u=u[:a]+replacement+u[b+2:]
          u=u.replace('Everything in this guide — authentic, bKash/Nagad, warranty on every plan.','Products referenced in this guide — current SaveOnSub price, access label, local payment options and applicable warranty shown on each product page.')
          bs.write_text(u,encoding='utf-8')

          # ----- permanent regression guard -----
          tg=Path('truth_guard.py'); g=tg.read_text(encoding='utf-8')
          anchor="    'Official subscriptions trusted in Bangladesh': 'unsupported trust/official blanket claim',\n"
          add="""    '৩,০০০+ কাস্টমার': 'unsupported customer-count claim',\n    '3,000+ customers': 'unsupported customer-count claim',\n    'We send a WhatsApp reminder 3 days before expiry': 'renewal reminder automation is not implemented',\n    \"You'll have gotten a WhatsApp reminder 3 days before\": 'renewal reminder automation is not implemented',\n    'we send access BEFORE you pay': 'pay-after-testing must be product/order-specific',\n    'we send access before you pay': 'pay-after-testing must be product/order-specific',\n    'Shared seats violate provider ToS': 'blanket provider-policy statement is unsafe',\n    'No. ChatGPT keeps each user': 'absolute shared-privacy claim is unsafe',\n    'আপনার চ্যাট, ফাইল বা ব্যক্তিগত ডেটা কেউ দেখে না': 'absolute shared-privacy claim is unsafe',\n    'only one with a written warranty': 'unsupported competitor superlative',\n    'thousands of times daily': 'unsupported scam-frequency claim',\n"""
          if 'unsupported customer-count claim' not in g:
              if anchor not in g: raise SystemExit('truth_guard anchor missing')
              g=g.replace(anchor,anchor+add,1)
          # Catalog-specific unsafe phrases only; don't reject the deliberate business warranty policy.
          marker='    # Public-repository data boundary: internal market-research metadata\n'
          if 'CATALOG_FORBIDDEN' not in g:
              block="""    CATALOG_FORBIDDEN = {\n        'No. ChatGPT keeps each user': 'absolute shared-privacy claim is unsafe',\n        'আপনার চ্যাট, ফাইল বা ব্যক্তিগত ডেটা কেউ দেখে না': 'absolute shared-privacy claim is unsafe',\n        '3,000+ customers': 'unsupported customer-count claim',\n        '৩,০০০+ কাস্টমার': 'unsupported customer-count claim',\n        'We send a WhatsApp reminder 3 days before expiry': 'renewal reminder automation is not implemented',\n        \"You'll have gotten a WhatsApp reminder 3 days before\": 'renewal reminder automation is not implemented',\n    }\n    catalog_claim_text = (ROOT / 'catalog.json').read_text(encoding='utf-8', errors='replace') if (ROOT / 'catalog.json').exists() else ''\n    for phrase, reason in CATALOG_FORBIDDEN.items():\n        if phrase in catalog_claim_text:\n            hits.append(('catalog.json', phrase, reason))\n\n"""
              if marker not in g: raise SystemExit('truth_guard catalog marker missing')
              g=g.replace(marker,block+marker,1)
          tg.write_text(g,encoding='utf-8')
          PY

      - name: Rebuild all generated surfaces
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          bash build_all.sh

      - name: Validate corrected production candidate
        run: |
          set -euo pipefail
          python truth_guard.py
          python check_prices.py
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/index.html
          ! grep -R -E '3,000\+ customers|৩,০০০\+ কাস্টমার|We send a WhatsApp reminder 3 days|You.ll have gotten a WhatsApp reminder 3 days|we send access BEFORE you pay|No\. ChatGPT keeps each user|আপনার চ্যাট, ফাইল বা ব্যক্তিগত ডেটা কেউ দেখে না|only one with a written warranty|thousands of times daily' _site --include='*.html' --include='*.txt' --include='*.js'
          ! grep -q '<lastmod>' sitemap.xml
          ! grep -q 'datePublished' blog/chatgpt-plus-price-in-bangladesh.html
          ! grep -q 'hreflang="bn-bd" href="https://saveonsub.com/blog/' blog/chatgpt-plus-price-in-bangladesh.html
          ! grep -q 'priceValidUntil' p/chatgpt-plus.html
          ! grep -q 'hasMerchantReturnPolicy' p/chatgpt-plus.html
          ! grep -q '145+ orders' p/chatgpt-plus.html
          ! grep -q '145+ অর্ডার' bn/p/chatgpt-plus.html
          ! grep -q '"orders"' assets/catalog.js
          grep -q 'Instant plans:' index.html
          grep -q 'Delivery follows the selected plan SLA' index.html
          echo 'Corrected P0/P1 truth + SEO candidate passed.'

      - name: Commit source and regenerated pages
        run: |
          set -euo pipefail
          rm -rf _site
          git config user.name 'sysmoai'
          git config user.email 'sysmoai.com@gmail.com'
          git add -A
          git reset .github/workflows/fix-truth-seo-safety-v2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden shared-access truth and SEO metadata'
          git push origin HEAD:main
