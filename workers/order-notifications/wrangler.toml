name = "saveonsub-order-notifications"
main = "src/index.ts"
compatibility_date = "2026-09-27"

[triggers]
crons = ["*/2 * * * *"]

# Bind the same dedicated SaveOnSub operational D1 database before deployment.
# [[d1_databases]]
# binding = "DB"
# database_name = "saveonsub-order-os"
# database_id = "<PRODUCTION_ID>"

# The old generic ORDER_NOTIFICATION_WEBHOOK is intentionally unused.
# Configure the SOS-only secrets SOS_RIPON_ALERT_WEBHOOK and SOS_EMON_ALERT_WEBHOOK
# after validating the owner and operator destinations. Never commit webhook URLs.
# Optional: SOS_PAID_ESCALATION_MINUTES (default 15; owner-approved SLA policy).
# If bindings or webhooks are absent, alert delivery is NOT active.
